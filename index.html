<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ---- 蔵書カード design tokens ----
const C = {
  paper: "#FAFAF7",
  ink: "#233A5C",
  rule: "#C9D4E0",
  red: "#C8443E",
  faint: "#8A93A3",
  white: "#FFFFFF",
  mark: "#FFF3B8",
};
const SERIF = `"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif`;
const SANS = `"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif`;
const KEY = "reading-cards-v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---- シード:職業としての学問 ----
// カードデータは cards/ 配下のJSONから読み込む（下部の loadCards 参照）

// ---- インライン整形 ----
function renderInline(text, key) {
  const parts = [];
  let rest = text;
  let i = 0;
  const re = /(\*\*([^*]+)\*\*|==([^=]+)==)/;
  while (rest) {
    const m = rest.match(re);
    if (!m) { parts.push(rest); break; }
    if (m.index > 0) parts.push(rest.slice(0, m.index));
    if (m[2] !== undefined) parts.push(<strong key={`${key}-b${i}`}>{m[2]}</strong>);
    else parts.push(<mark key={`${key}-m${i}`} style={{ background: C.mark, padding: "0 2px" }}>{m[3]}</mark>);
    rest = rest.slice(m.index + m[0].length);
    i++;
  }
  return parts;
}

// ---- 行配列の整形(段落・リスト)。onPickで文タップ選択に対応 ----
function Lines({ lines, k, onPick, selected }) {
  const out = [];
  let list = null;
  const pickStyle = (raw) => ({
    cursor: onPick ? "pointer" : "default",
    background: selected === raw ? "#FCE9E8" : "transparent",
    borderRadius: 4,
    transition: "background .15s",
  });
  const flush = (i) => {
    if (!list) return;
    const Tag = list.type;
    out.push(
      <Tag key={`${k}-l${i}`} style={{ margin: "4px 0 12px", paddingLeft: 22 }}>
        {list.items.map((it, j) => (
          <li
            key={j}
            onClick={() => onPick && onPick(it.raw)}
            style={{ marginBottom: 6, lineHeight: 1.9, ...pickStyle(it.raw) }}
          >
            {renderInline(it.text, `${k}-${i}-${j}`)}
          </li>
        ))}
      </Tag>
    );
    list = null;
  };
  lines.forEach((raw, i) => {
    const line = raw.trimEnd();
    const img = line.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);
    if (img) {
      flush(i);
      out.push(
        <figure key={`${k}-f${i}`} style={{ margin: "6px 0 18px", padding: 0 }}>
          <a href={img[2]} target="_blank" rel="noopener"><img
            src={img[2]}
            alt={img[1]}
            loading="lazy"
            style={{ display: "block", width: "100%", maxWidth: 680, height: "auto", margin: "0 auto", borderRadius: 6, border: `1px solid ${C.rule}`, background: C.paper }}
          /></a>
          <figcaption style={{ fontSize: 11, color: C.faint, textAlign: "right", marginTop: 4 }}>タップで拡大</figcaption>
        </figure>
      );
      return;
    }
    const ul = line.match(/^[-・]\s+(.*)/);
    const ol = line.match(/^\d+[.)]\s+(.*)/);
    if (ul) {
      if (!list || list.type !== "ul") { flush(i); list = { type: "ul", items: [] }; }
      list.items.push({ raw, text: ul[1] });
      return;
    }
    if (ol) {
      if (!list || list.type !== "ol") { flush(i); list = { type: "ol", items: [] }; }
      list.items.push({ raw, text: ol[1] });
      return;
    }
    flush(i);
    if (!line) return;
    out.push(
      <p
        key={`${k}-p${i}`}
        onClick={() => onPick && onPick(raw)}
        style={{ margin: "0 0 12px", lineHeight: 1.95, ...pickStyle(raw) }}
      >
        {renderInline(line, `${k}-p${i}`)}
      </p>
    );
  });
  flush("end");
  return <div>{out}</div>;
}

// ---- 本文 → 章・項目の構造に分解 ----
// ## 章タイトル / ### 項目タイトル / それ以外は本文行
function parseBook(body) {
  const preamble = [];
  const chapters = [];
  let ch = null;
  let sec = null;
  body.split("\n").forEach((raw) => {
    const h2 = raw.match(/^##(?!#)\s+(.*)/);
    const h3 = raw.match(/^###\s+(.*)/);
    if (h2) {
      ch = { title: h2[1].trim(), intro: [], sections: [] };
      sec = null;
      chapters.push(ch);
      return;
    }
    if (h3 && ch) {
      sec = { title: h3[1].trim(), lines: [] };
      ch.sections.push(sec);
      return;
    }
    if (sec) sec.lines.push(raw);
    else if (ch) ch.intro.push(raw);
    else preamble.push(raw);
  });
  return { preamble, chapters };
}

const hasText = (lines) => lines.some((l) => l.trim());

// ---- 章構造 → テキストに戻す ----
const serializeChapter = (c) => {
  const lines = [`## ${c.title}`, ...c.intro];
  c.sections.forEach((s) => {
    lines.push(`### ${s.title}`, ...s.lines);
  });
  return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
};

// ---- 開閉マーカー ----
function Caret({ open }) {
  return (
    <span
      style={{
        display: "inline-block",
        transition: "transform .15s",
        transform: open ? "rotate(90deg)" : "rotate(0deg)",
        color: C.red,
        fontSize: 12,
        width: 16,
        flexShrink: 0,
      }}
    >
      ▶
    </span>
  );
}

// ---- 表紙（本棚用）----
const COVER_TONES = ["#233A5C", "#5C3A2E", "#2E5C4A", "#4A2E5C", "#5C4F2E", "#2E4F5C"];
function BookCover({ n }) {
  const [broken, setBroken] = useState(false);
  const frame = {
    width: "100%", aspectRatio: "2 / 3", borderRadius: 3, overflow: "hidden",
    boxShadow: "0 1px 2px rgba(35,58,92,0.18), 0 6px 14px rgba(35,58,92,0.16)",
    background: "#E9ECEF",
  };
  if (n.cover && !broken) {
    return (
      <div style={frame}>
        <img src={n.cover} alt={n.title} loading="lazy" onError={() => setBroken(true)}
          style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
      </div>
    );
  }
  const tone = COVER_TONES[[...n.id].reduce((a, c) => a + c.charCodeAt(0), 0) % COVER_TONES.length];
  return (
    <div style={{ ...frame, background: tone, color: "#FAFAF7", display: "flex", flexDirection: "column",
      justifyContent: "space-between", padding: "14% 11%", boxSizing: "border-box" }}>
      <div style={{ fontFamily: SERIF, fontSize: 13, fontWeight: 600, lineHeight: 1.5,
        display: "-webkit-box", WebkitLineClamp: 5, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
        {n.title}
      </div>
      <div style={{ fontSize: 10, opacity: 0.8 }}>{n.author}</div>
    </div>
  );
}

function ReadingCards() {
  const [notes, setNotes] = useState([]);
  const sharedRef = useRef({}); // GitHub上の共有カード（id → カード）
  const [trash, setTrash] = useState([]); // 削除したカードの退避スタック（新しい順）
  const [confirmId, setConfirmId] = useState(null); // 削除確認中のカードID
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("list"); // list | read | add
  const [activeId, setActiveId] = useState(null);
  const [query, setQuery] = useState("");
  const [tag, setTag] = useState(null);
  const [openCh, setOpenCh] = useState(new Set());
  const [openSec, setOpenSec] = useState(new Set());
  // AI質問(文単位)
  const [sel, setSel] = useState(null);       // { line: 選択した生テキスト行, ctx: 章のメモ全文 }
  const [askText, setAskText] = useState("");
  const [answer, setAnswer] = useState("");
  const [asking, setAsking] = useState(false);
  const [askErr, setAskErr] = useState("");

  useEffect(() => {
    (async () => {
      // 1) GitHub上の共有カード（cards/*.json）を読む
      let shared = [];
      try {
        const idxRes = await fetch("cards.json", { cache: "no-store" });
        const idx = await idxRes.json();
        const files = (idx && Array.isArray(idx.files)) ? idx.files : [];
        const loaded = await Promise.all(
          files.map((fn) =>
            fetch(fn, { cache: "no-store" })
              .then((r) => r.json())
              .catch(() => null)
          )
        );
        shared = loaded.filter(Boolean).map((c) => ({ ...c, createdAt: c.createdAt || 0 }));
      } catch (e) { /* ローカルfile://で開いた等。共有カードなしで続行 */ }

      // 2) このブラウザでの追加・編集分と、削除した共有カードのID（localStorage）
      const sharedIds = new Set(shared.map((n) => n.id));
      let localNotes = [];
      let deleted = [];
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const d = JSON.parse(raw);
          if (d && d.v === 2) {
            localNotes = Array.isArray(d.local) ? d.local : [];
            deleted = Array.isArray(d.deleted) ? d.deleted : [];
          } else if (d && Array.isArray(d.notes)) {
            // 旧形式：全カードのスナップショット。共有カードは最新版を優先し、独自追加分だけ引き継ぐ
            localNotes = d.notes.filter((n) => !sharedIds.has(n.id));
          }
        }
      } catch (e) { /* 初回 */ }

      sharedRef.current = Object.fromEntries(shared.map((n) => [n.id, n]));

      // 3) マージ：独自追加カード → 共有カード（削除分は除外、編集分は上書き）
      const merged = [
        ...localNotes.filter((n) => !sharedIds.has(n.id)),
        ...shared
          .filter((n) => !deleted.includes(n.id))
          .map((s) => {
            const o = localNotes.find((n) => n.id === s.id);
            return o ? { ...s, ...o, cover: s.cover || o.cover } : s;
          }),
      ];

      setNotes(merged.length ? merged : shared);
      setLoaded(true);
    })();
  }, []);

  const save = useCallback(async (next) => {
    setNotes(next);
    try {
      // 共有カードと違うもの（独自追加・編集）と、削除した共有カードのIDだけを保存する
      const sm = sharedRef.current;
      const local = next.filter((n) => !sm[n.id] || n.body !== sm[n.id].body || n.title !== sm[n.id].title);
      const deleted = Object.keys(sm).filter((id) => !next.some((n) => n.id === id));
      localStorage.setItem(KEY, JSON.stringify({ v: 2, local, deleted }));
    } catch (e) {
      console.error("save failed", e);
    }
  }, []);

  const active = notes.find((n) => n.id === activeId);
  const book = useMemo(() => (active ? parseBook(active.body) : null), [active]);
  const allTags = [...new Set(notes.flatMap((n) => n.tags))];

  const filtered = notes
    .filter((n) => !tag || n.tags.includes(tag))
    .filter((n) => {
      if (!query.trim()) return true;
      const q = query.toLowerCase();
      return (
        n.title.toLowerCase().includes(q) ||
        (n.author || "").toLowerCase().includes(q) ||
        n.tags.join(",").toLowerCase().includes(q) ||
        n.body.toLowerCase().includes(q)
      );
    })
    .sort((a, b) => b.createdAt - a.createdAt);

  const openBook = (id) => {
    setActiveId(id);
    setOpenCh(new Set());   // 全部閉じた状態で開く
    setOpenSec(new Set());
    setView("read");
  };

  const toggle = (set, setter, key) => {
    const next = new Set(set);
    next.has(key) ? next.delete(key) : next.add(key);
    setter(next);
  };

  const removeNote = async (id) => {
    const deleted = notes.find((n) => n.id === id);
    await save(notes.filter((n) => n.id !== id));
    if (deleted) setTrash((t) => [deleted, ...t]); // 退避してあとで戻せるようにする
    setConfirmId(null);
    setView("list");
    setActiveId(null);
  };

  // ---- 直前に削除したカードを1枚戻す ----
  const undoDelete = async () => {
    if (trash.length === 0) return;
    const [restore, ...rest] = trash;
    if (!notes.some((n) => n.id === restore.id)) {
      await save([restore, ...notes]);
    }
    setTrash(rest);
  };

  // ---- 元に戻すバーを閉じる（退避はすべて破棄） ----
  const dismissUndo = () => setTrash([]);

  // ---- 選択した文についてAIに質問 → 書き換え案を生成 ----
  const askAI = async () => {
    if (!sel || asking) return;
    setAsking(true); setAskErr(""); setAnswer("");
    // AI書き換え機能は公開版（GitHub Pages）では利用できません。
    setAskErr("この公開版ではAI書き換え機能は使えません（閲覧・追加・削除・検索・元に戻すは使えます）。");
    setAsking(false);
  };

  // ---- 書き換え案で選択した文だけを置き換える ----
  const applyRewrite = async () => {
    if (!sel || !answer) return;
    const txt = answer.trim().replace(/```[a-z]*\n?|```/g, "").trim();
    const body = active.body;
    const idx = body.indexOf(sel.line);
    if (idx === -1) {
      setAskErr("対象の文が見つかりませんでした。");
      return;
    }
    const newBody = body.slice(0, idx) + txt + body.slice(idx + sel.line.length);
    const next = notes.map((n) => (n.id === active.id ? { ...n, body: newBody } : n));
    await save(next);
    setSel(null); setAskText(""); setAnswer("");
  };

  const pickLine = (raw, ctx) => {
    setSel({ line: raw, ctx });
    setAskText(""); setAnswer(""); setAskErr("");
  };

  const page = {
    minHeight: "100vh",
    background: C.paper,
    fontFamily: SANS,
    color: C.ink,
    maxWidth: 680,
    margin: "0 auto",
  };
  const input = {
    width: "100%",
    boxSizing: "border-box",
    padding: "11px 14px",
    border: `1px solid ${C.rule}`,
    borderRadius: 8,
    background: C.white,
    fontSize: 15,
    color: C.ink,
    outline: "none",
    fontFamily: SANS,
  };
  const chip = (on) => ({
    padding: "5px 13px",
    borderRadius: 999,
    border: `1px solid ${on ? C.red : C.rule}`,
    background: on ? C.red : C.white,
    color: on ? C.white : C.ink,
    fontSize: 13,
    whiteSpace: "nowrap",
    cursor: "pointer",
  });

  if (!loaded)
    return (
      <div style={{ ...page, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <span style={{ color: C.faint }}>読み込み中…</span>
      </div>
    );

  // ================= 閲覧(目次アコーディオン) =================
  if (view === "read" && active && book) {
    const allOpen = openCh.size >= book.chapters.length && book.chapters.length > 0;
    const expandAll = () => {
      if (allOpen) { setOpenCh(new Set()); setOpenSec(new Set()); }
      else {
        setOpenCh(new Set(book.chapters.map((_, i) => i)));
        const s = new Set();
        book.chapters.forEach((c, ci) => c.sections.forEach((_, si) => s.add(`${ci}-${si}`)));
        setOpenSec(s);
      }
    };
    return (
      <div style={page}>
        <header
          style={{
            position: "sticky", top: 0, zIndex: 10, background: C.paper,
            display: "flex", justifyContent: "space-between", alignItems: "center",
            padding: "14px 18px 10px", borderBottom: `1px solid ${C.rule}`,
          }}
        >
          <button onClick={() => setView("list")}
            style={{ border: "none", background: "none", color: C.ink, fontSize: 15, cursor: "pointer", padding: 0 }}>
            ← 一覧
          </button>
          <div style={{ display: "flex", gap: 16 }}>
            <button onClick={expandAll}
              style={{ border: "none", background: "none", color: C.ink, fontSize: 13, cursor: "pointer", padding: 0 }}>
              {allOpen ? "すべて閉じる" : "すべて開く"}
            </button>
            <button onClick={() => setConfirmId(active.id)}
              style={{ border: "none", background: "none", color: C.faint, fontSize: 13, cursor: "pointer", padding: 0 }}>
              削除
            </button>
          </div>
        </header>

        <article style={{ padding: "22px 18px 80px" }}>
          <div style={{ height: 3, background: C.red, width: 56, marginBottom: 14 }} />
          <h1 style={{ fontFamily: SERIF, fontSize: 24, margin: "0 0 6px", lineHeight: 1.5 }}>
            {active.title}
          </h1>
          {active.author && (
            <div style={{ fontSize: 13, color: C.faint, marginBottom: 8 }}>{active.author}</div>
          )}
          {active.tags.length > 0 && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
              {active.tags.map((t) => (
                <span key={t} style={{ fontSize: 11, color: C.red, border: `1px solid ${C.red}`, borderRadius: 999, padding: "1px 9px" }}>
                  #{t}
                </span>
              ))}
            </div>
          )}

          {hasText(book.preamble) && (
            <div style={{ fontSize: 14.5, color: C.ink, marginBottom: 18, paddingBottom: 14, borderBottom: `1px dashed ${C.rule}` }}>
              <Lines
                lines={book.preamble}
                k="pre"
                selected={sel ? sel.line : null}
                onPick={(raw) => pickLine(raw, book.preamble.join("\n"))}
              />
            </div>
          )}

          <div style={{ fontSize: 12, color: C.faint, marginBottom: 12 }}>
            タップで文を選択できます
          </div>

          {/* 目次 = 章のアコーディオン */}
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {book.chapters.map((c, ci) => {
              const cOpen = openCh.has(ci);
              return (
                <section
                  key={ci}
                  style={{
                    background: C.white,
                    border: `1px solid ${cOpen ? C.ink : C.rule}`,
                    borderRadius: 10,
                    overflow: "hidden",
                  }}
                >
                  <button
                    onClick={() => toggle(openCh, setOpenCh, ci)}
                    style={{
                      display: "flex", alignItems: "center", gap: 8,
                      width: "100%", textAlign: "left",
                      padding: "14px 14px",
                      border: "none", background: "none", cursor: "pointer",
                      fontFamily: SERIF, fontSize: 16.5, color: C.ink, lineHeight: 1.5,
                    }}
                  >
                    <Caret open={cOpen} />
                    <span style={{ flex: 1 }}>{c.title}</span>
                    {c.sections.length > 0 && (
                      <span style={{ fontSize: 11, color: C.faint, fontFamily: SANS }}>
                        {c.sections.length}項目
                      </span>
                    )}
                  </button>

                  {cOpen && (
                    <div style={{ padding: "0 16px 14px 38px", fontSize: 15 }}>
                      {hasText(c.intro) && (
                        <Lines
                          lines={c.intro}
                          k={`c${ci}`}
                          selected={sel ? sel.line : null}
                          onPick={(raw) => pickLine(raw, serializeChapter(c))}
                        />
                      )}

                      {/* 項目(###)のアコーディオン */}
                      {c.sections.map((s, si) => {
                        const key = `${ci}-${si}`;
                        const sOpen = openSec.has(key);
                        return (
                          <div key={key} style={{ borderTop: `1px solid ${C.rule}` }}>
                            <button
                              onClick={() => toggle(openSec, setOpenSec, key)}
                              style={{
                                display: "flex", alignItems: "center", gap: 8,
                                width: "100%", textAlign: "left",
                                padding: "11px 0",
                                border: "none", background: "none", cursor: "pointer",
                                fontSize: 14.5, fontWeight: 600, color: C.ink, lineHeight: 1.5,
                              }}
                            >
                              <Caret open={sOpen} />
                              <span>{s.title}</span>
                            </button>
                            {sOpen && (
                              <div style={{ padding: "0 0 10px 24px", fontSize: 14.5 }}>
                                <Lines
                                  lines={s.lines}
                                  k={key}
                                  selected={sel ? sel.line : null}
                                  onPick={(raw) => pickLine(raw, serializeChapter(c))}
                                />
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </section>
              );
            })}
          </div>
        </article>

        {/* 削除確認ダイアログ */}
        {confirmId && (
          <div
            onClick={() => setConfirmId(null)}
            style={{
              position: "fixed", inset: 0, zIndex: 40,
              background: "rgba(35,58,92,0.28)",
              display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
            }}
          >
            <div
              onClick={(e) => e.stopPropagation()}
              style={{
                background: C.white, borderRadius: 14, padding: "22px 20px 18px",
                width: "min(340px, 100%)", boxShadow: "0 10px 30px rgba(35,58,92,0.3)",
                borderTop: `4px solid ${C.red}`,
              }}
            >
              <div style={{ fontFamily: SERIF, fontSize: 17, marginBottom: 8 }}>カードを削除しますか？</div>
              <div style={{ fontSize: 13, color: C.faint, lineHeight: 1.7, marginBottom: 18 }}>
                「{active.title}」を削除します。削除後も画面下の「元に戻す」から復元できます。
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button
                  onClick={() => setConfirmId(null)}
                  style={{ flex: 1, padding: "11px 14px", borderRadius: 8, border: `1px solid ${C.rule}`, background: C.white, color: C.ink, fontSize: 14, cursor: "pointer" }}
                >
                  キャンセル
                </button>
                <button
                  onClick={() => removeNote(active.id)}
                  style={{ flex: 1, padding: "11px 14px", borderRadius: 8, border: "none", background: C.red, color: C.white, fontSize: 14, cursor: "pointer" }}
                >
                  削除する
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 文の質問・書き換えシート */}
        {sel && (
          <div
            style={{
              position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
              width: "min(680px, 100%)", boxSizing: "border-box",
              maxHeight: "62vh", overflowY: "auto",
              background: C.white, borderTop: `3px solid ${C.red}`,
              boxShadow: "0 -6px 20px rgba(35,58,92,0.18)",
              borderRadius: "14px 14px 0 0",
              padding: "14px 18px 20px", zIndex: 20,
            }}
          >
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontSize: 12, color: C.red, fontWeight: 600, letterSpacing: 1 }}>選択中の文</span>
              <button
                onClick={() => { setSel(null); setAskText(""); setAnswer(""); setAskErr(""); }}
                style={{ border: "none", background: "none", color: C.faint, fontSize: 13, cursor: "pointer", padding: 0 }}
              >
                ✕ 閉じる
              </button>
            </div>
            <div
              style={{
                fontSize: 13, lineHeight: 1.8, color: C.ink, background: C.paper,
                border: `1px solid ${C.rule}`, borderRadius: 8, padding: "8px 12px", marginBottom: 10,
                display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden",
              }}
            >
              {sel.line.replace(/^[\s\-・]+/, "").replace(/\*\*|==/g, "")}
            </div>

            {!answer && (
              <>
                <textarea
                  value={askText}
                  onChange={(e) => setAskText(e.target.value)}
                  placeholder="疑問を入力（空欄のまま送ると「より分かりやすく」書き直します）"
                  style={{
                    width: "100%", boxSizing: "border-box", minHeight: 64,
                    padding: "10px 12px", border: `1px solid ${C.rule}`, borderRadius: 8,
                    fontSize: 14, fontFamily: SANS, color: C.ink, outline: "none",
                    lineHeight: 1.7, resize: "vertical",
                  }}
                />
                <button
                  onClick={askAI}
                  disabled={asking}
                  style={{
                    marginTop: 8, padding: "11px 20px", borderRadius: 8, border: "none",
                    background: asking ? C.rule : C.ink, color: C.white,
                    fontSize: 14, cursor: asking ? "default" : "pointer", width: "100%",
                  }}
                >
                  {asking ? "書き換え案を考え中…" : "AIに質問して書き換え案をもらう"}
                </button>
              </>
            )}

            {askErr && <div style={{ fontSize: 12.5, color: C.red, marginTop: 8 }}>{askErr}</div>}

            {answer && (
              <div style={{ background: C.paper, border: `1px solid ${C.rule}`, borderRadius: 8, padding: "12px 14px" }}>
                <div style={{ fontSize: 11, color: C.red, fontWeight: 600, letterSpacing: 1, marginBottom: 6 }}>
                  書き換え案
                </div>
                <div style={{ fontSize: 14, lineHeight: 1.9 }}>
                  <Lines lines={answer.split("\n")} k="prev" />
                </div>
                <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
                  <button
                    onClick={applyRewrite}
                    style={{ flex: 1, padding: "11px 16px", borderRadius: 8, border: "none", background: C.red, color: C.white, fontSize: 14, cursor: "pointer" }}
                  >
                    この文を書き換える
                  </button>
                  <button
                    onClick={() => setAnswer("")}
                    style={{ padding: "11px 14px", borderRadius: 8, border: `1px solid ${C.rule}`, background: C.white, color: C.faint, fontSize: 13, cursor: "pointer" }}
                  >
                    破棄
                  </button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  // ================= 一覧 =================
  return (
    <div style={page}>
      <header style={{ padding: "22px 18px 0" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
          <h1 style={{ fontFamily: SERIF, fontSize: 26, fontWeight: 600, margin: 0, letterSpacing: 2 }}>
            読書カード
          </h1>
          <span style={{ fontSize: 12, color: C.faint }}>{notes.length} 冊</span>
        </div>
        <div style={{ height: 2, background: C.red, marginTop: 10 }} />
      </header>

      <div style={{ padding: "14px 18px 6px" }}>
        <input
          style={input}
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder="書名・著者・本文を検索"
        />
      </div>

      {allTags.length > 0 && (
        <div style={{ display: "flex", gap: 7, overflowX: "auto", padding: "6px 18px 4px" }}>
          {allTags.map((t) => (
            <button key={t} style={chip(tag === t)} onClick={() => setTag(tag === t ? null : t)}>
              #{t}
            </button>
          ))}
        </div>
      )}

      <main
        style={{
          padding: "16px 18px 120px",
          display: "grid",
          gridTemplateColumns: "repeat(auto-fill, minmax(104px, 1fr))",
          gap: "26px 16px",
          alignItems: "start",
        }}
      >
        {filtered.length === 0 && (
          <div style={{ gridColumn: "1 / -1", textAlign: "center", color: C.faint, padding: "48px 0", fontSize: 14 }}>
            該当するカードがありません
          </div>
        )}
        {filtered.map((n) => (
          <article key={n.id} onClick={() => openBook(n.id)} style={{ cursor: "pointer", minWidth: 0 }}>
            <BookCover n={n} />
            <h2
              style={{
                fontFamily: SERIF, fontSize: 12.5, fontWeight: 600, margin: "9px 0 2px", lineHeight: 1.45,
                display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden",
              }}
            >
              {n.title}
            </h2>
            {n.author && (
              <div style={{ fontSize: 11, color: C.faint, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                {n.author}
              </div>
            )}
          </article>
        ))}
      </main>

      {/* 削除の取り消しバー */}
      {trash.length > 0 && (
        <div
          style={{
            position: "fixed",
            bottom: 24,
            left: "max(18px, calc(50% - 322px))",
            display: "flex",
            alignItems: "center",
            gap: 12,
            maxWidth: "min(430px, calc(100% - 150px))",
            background: C.ink,
            color: C.white,
            borderRadius: 10,
            padding: "12px 14px",
            boxShadow: "0 4px 14px rgba(35,58,92,0.3)",
            fontSize: 13,
            zIndex: 30,
          }}
        >
          <span
            style={{
              flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
            }}
          >
            「{trash[0].title}」を削除しました
          </span>
          <button
            onClick={undoDelete}
            style={{
              border: "none", background: "none", color: C.mark,
              fontSize: 13, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", padding: 0,
            }}
          >
            元に戻す
          </button>
          <button
            onClick={dismissUndo}
            style={{
              border: "none", background: "none", color: C.faint,
              fontSize: 14, cursor: "pointer", padding: "0 2px", lineHeight: 1,
            }}
            aria-label="閉じる"
          >
            ✕
          </button>
        </div>
      )}

    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<ReadingCards />);
</script>
</body>
</html>
