<svg width="680" height="290" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 290" role="img"><title>課外活動の監督の決め方の比較</title><desc>日本は学校の上層部が教員を顧問に割り当てる。パブリックスクールでは部員が指導してほしいマスターを決め、部長が依頼状を送り、指導が悪ければ解任状を送る</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="36">よくある日本の形</text>
<g class="c-gray"><rect x="40" y="50" width="180" height="50" rx="8" stroke-width="0.5"/><text class="t" x="130" y="75" text-anchor="middle" dominant-baseline="central">校長・学校側</text></g>
<line x1="220" y1="75" x2="266" y2="75" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="244" y="64" text-anchor="middle">割当</text>
<g class="c-gray"><rect x="270" y="50" width="160" height="50" rx="8" stroke-width="0.5"/><text class="t" x="350" y="75" text-anchor="middle" dominant-baseline="central">教員が顧問に</text></g>
<text class="th" x="40" y="150">パブリックスクール</text>
<g class="c-teal"><rect x="40" y="164" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="184" text-anchor="middle" dominant-baseline="central">部員</text><text class="ts" x="130" y="204" text-anchor="middle" dominant-baseline="central">誰に教わりたいか決める</text></g>
<line x1="220" y1="192" x2="266" y2="192" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="270" y="164" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="350" y="184" text-anchor="middle" dominant-baseline="central">部長</text><text class="ts" x="350" y="204" text-anchor="middle" dominant-baseline="central">依頼状を送る</text></g>
<line x1="430" y1="192" x2="476" y2="192" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="480" y="164" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="184" text-anchor="middle" dominant-baseline="central">マスター</text><text class="ts" x="560" y="204" text-anchor="middle" dominant-baseline="central">引き受ける</text></g>
<path d="M560 220 L560 256 L350 256 L350 224" fill="none" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="455" y="276" text-anchor="middle">指導が悪ければ、部長が丁寧な解任状を送る</text>
</svg>