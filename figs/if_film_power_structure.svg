<g class="c-gray"><rect x="200" y="164" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="184" text-anchor="middle" dominant-baseline="central">下級生</text><text class="ts" x="340" y="204" text-anchor="middle" dominant-baseline="central">保護されるはずが服従させられる</text></g>
<g class="c-teal"><rect x="510" y="100" width="150" height="70" rx="8" stroke-width="0.5"/><text class="th" x="585" y="124" text-anchor="middle" dominant-baseline="central">反逆する</text><text class="th" x="585" y="146" text-anchor="middle" dominant-baseline="central">上級生 3人</text></g>
<path d="M510 120 L484 56" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="20" y="100" width="160" height="70" rx="8" stroke-width="0.5"/><text class="th" x="100" y="124" text-anchor="middle" dominant-baseline="central">本来の制度</text><text class="ts" x="100" y="146" text-anchor="middle" dominant-baseline="central">世話とリーダー修行</text></g>
</svg>