<svg width="680" height="370" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 370" role="img"><title>ハロウ校の生徒の一日</title><desc>7時30分起床から夕食までの時間割。午前に5コマ、昼食は実質20分</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<line x1="150" y1="44" x2="150" y2="330" stroke="var(--b)" stroke-width="1"/>
<g><circle cx="150" cy="50" r="5" fill="#888780"/><text class="ts" x="130" y="54" text-anchor="end">7:30</text><text class="t" x="170" y="54">起床・シャワー・着替え → 寮監の点呼</text></g>
<g><circle cx="150" cy="84" r="5" fill="#888780"/><text class="ts" x="130" y="88" text-anchor="end">朝</text><text class="t" x="170" y="88">朝食</text></g>
<g><circle cx="150" cy="118" r="5" fill="#888780"/><text class="ts" x="130" y="122" text-anchor="end">8:30–8:50</text><text class="t" x="170" y="122">チャペル（火・木）／全校集会（月）</text></g>
<g><circle cx="150" cy="152" r="5" fill="#7F77DD"/><text class="ts" x="130" y="156" text-anchor="end">午前</text><text class="t" x="170" y="156">授業3コマ（40分、移動5分、鞄禁止）</text></g>
<g><circle cx="150" cy="186" r="5" fill="#1D9E75"/><text class="ts" x="130" y="190" text-anchor="end">11:00</text><text class="t" x="170" y="190">休憩20分（寮か生徒専用カフェ）</text></g>
<g><circle cx="150" cy="220" r="5" fill="#7F77DD"/><text class="ts" x="130" y="224" text-anchor="end">昼まで</text><text class="t" x="170" y="224">授業2コマ</text></g>
<g><circle cx="150" cy="254" r="5" fill="#D85A30"/><text class="ts" x="130" y="258" text-anchor="end">12:50–14:25</text><text class="t" x="170" y="258">昼休み（食堂は13:30閉店 → 実質20分）</text></g>
<g><circle cx="150" cy="288" r="5" fill="#7F77DD"/><text class="ts" x="130" y="292" text-anchor="end">午後</text><text class="t" x="170" y="292">授業／スポーツ・CCF・社会奉仕（曜日別）</text></g>
<g><circle cx="150" cy="322" r="5" fill="#888780"/><text class="ts" x="130" y="326" text-anchor="end">18:00–19:00</text><text class="t" x="170" y="326">少しの自由時間のあと夕食</text></g>
</svg>