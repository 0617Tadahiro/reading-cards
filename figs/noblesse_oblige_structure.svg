<g class="c-purple"><rect x="140" y="180" width="400" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="198" text-anchor="middle" dominant-baseline="central">見返りを求めない</text><text class="ts" x="340" y="216" text-anchor="middle" dominant-baseline="central">評価・栄誉・褒賞は目的ではない</text></g>
