<rect x="340" y="106" width="60" height="22" rx="4" fill="#5DCAA5"/>
<text class="ts" x="408" y="122">数年の訓練</text>
<text class="t" x="40" y="160">ハウスマスター</text>
<circle cx="400" cy="157" r="6" fill="#534AB7"/>
<text class="ts" x="400" y="186" text-anchor="middle">校長が任命</text>
<rect x="406" y="146" width="200" height="22" rx="4" fill="#F0997B"/>
<text class="ts" x="506" y="161" text-anchor="middle">約10年在職</text>
</svg>