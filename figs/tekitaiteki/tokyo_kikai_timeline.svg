<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 470" role="img"><style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;fill:#2C2C2A}.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.arr{stroke:#73726C;stroke-width:1.5;fill:none}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 4;fill:none}.c-coral rect,.c-coral circle,.c-coral ellipse,.c-coral polygon,.c-coral path{fill:#FAECE7;stroke:#D85A30}.c-coral text,.c-coral .th,.c-coral .ts{fill:#712B13}rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}.c-teal rect,.c-teal circle,.c-teal ellipse,.c-teal polygon,.c-teal path{fill:#E1F5EE;stroke:#0F6E56}.c-teal text,.c-teal .th,.c-teal .ts{fill:#085041}rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-gray rect,.c-gray circle,.c-gray ellipse,.c-gray polygon,.c-gray path{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text,.c-gray .th,.c-gray .ts{fill:#2C2C2A}rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-blue rect,.c-blue circle,.c-blue ellipse,.c-blue polygon,.c-blue path{fill:#E6F1FB;stroke:#185FA5}.c-blue text,.c-blue .th,.c-blue .ts{fill:#0C447C}rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-purple rect,.c-purple circle,.c-purple ellipse,.c-purple polygon,.c-purple path{fill:#EEEDFE;stroke:#534AB7}.c-purple text,.c-purple .th,.c-purple .ts{fill:#3C3489}rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-amber rect,.c-amber circle,.c-amber ellipse,.c-amber polygon,.c-amber path{fill:#FAEEDA;stroke:#BA7517}.c-amber text,.c-amber .th,.c-amber .ts{fill:#633806}rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}.c-green rect,.c-green circle,.c-green ellipse,.c-green polygon,.c-green path{fill:#EAF3DE;stroke:#3B6D11}.c-green text,.c-green .th,.c-green .ts{fill:#27500A}rect.c-green,circle.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-red rect,.c-red circle,.c-red ellipse,.c-red polygon,.c-red path{fill:#FCEBEB;stroke:#A32D2D}.c-red text,.c-red .th,.c-red .ts{fill:#791F1F}rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-pink rect,.c-pink circle,.c-pink ellipse,.c-pink polygon,.c-pink path{fill:#FBEAF0;stroke:#993556}.c-pink text,.c-pink .th,.c-pink .ts{fill:#72243E}rect.c-pink,circle.c-pink{fill:#FBEAF0;stroke:#993556}</style><rect width="100%" height="100%" fill="#FFFFFF"/><title>東京機械製作所の防衛策は地裁・高裁・最高裁の3段階すべてで認められた</title><desc>2021年6月の買い集め開始から2022年2月の株式売却までの縦の年表。著者の関与は8月24日から</desc>
<line x1="160" y1="30" x2="160" y2="440" stroke="#B4B2A9" stroke-width="1"/>
<g><circle cx="160" cy="40" r="5" fill="#2C2C2A"/><text class="ts" x="140" y="44" text-anchor="end">2021年6月〜</text><text class="t" x="180" y="44">ADCが市場で株を買い集め始める</text></g>
<g><circle cx="160" cy="80" r="5" fill="#2C2C2A"/><text class="ts" x="140" y="84" text-anchor="end">7月20日</text><text class="t" x="180" y="84">大量保有報告書で8%強が判明</text></g>
<g><circle cx="160" cy="120" r="5" fill="#2C2C2A"/><text class="ts" x="140" y="124" text-anchor="end">8月6日</text><text class="t" x="180" y="124">取締役会が防衛策の導入を決定</text></g>
<g class="c-coral"><rect x="176" y="146" width="330" height="32" rx="6" stroke-width="0.5"/><text class="th" x="190" y="166">8月24日 著者が本社を訪問</text></g>
<circle cx="160" cy="162" r="6" fill="#D85A30"/>
<g><circle cx="160" cy="210" r="5" fill="#2C2C2A"/><text class="ts" x="140" y="214" text-anchor="end">10月22日</text><text class="t" x="180" y="214">臨時株主総会で発動を承認（ADCは議決権なし）</text></g>
<g class="c-teal"><rect x="176" y="236" width="300" height="32" rx="6" stroke-width="0.5"/><text class="th" x="190" y="256">10月29日 東京地裁 差止め却下</text></g>
<circle cx="160" cy="252" r="5" fill="#1D9E75"/>
<g class="c-teal"><rect x="176" y="278" width="300" height="32" rx="6" stroke-width="0.5"/><text class="th" x="190" y="298">11月9日 東京高裁 抗告棄却</text></g>
<circle cx="160" cy="294" r="5" fill="#1D9E75"/>
<g><circle cx="160" cy="336" r="5" fill="#2C2C2A"/><text class="ts" x="140" y="340" text-anchor="end">11月17日</text><text class="t" x="180" y="340">ADCが保有比率を下げると誓約、発動を留保</text></g>
<g class="c-teal"><rect x="176" y="362" width="300" height="32" rx="6" stroke-width="0.5"/><text class="th" x="190" y="382">11月18日 最高裁 抗告棄却</text></g>
<circle cx="160" cy="378" r="5" fill="#1D9E75"/>
<g><circle cx="160" cy="426" r="5" fill="#2C2C2A"/><text class="ts" x="140" y="430" text-anchor="end">2022年2月</text><text class="t" x="180" y="430">ADCが32%を読売など新聞社に売却</text></g>
</svg>
