<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 470" role="img"><style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;fill:#2C2C2A}.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.arr{stroke:#73726C;stroke-width:1.5;fill:none}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 4;fill:none}.c-coral rect,.c-coral circle,.c-coral ellipse,.c-coral polygon,.c-coral path{fill:#FAECE7;stroke:#D85A30}.c-coral text,.c-coral .th,.c-coral .ts{fill:#712B13}rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}.c-teal rect,.c-teal circle,.c-teal ellipse,.c-teal polygon,.c-teal path{fill:#E1F5EE;stroke:#0F6E56}.c-teal text,.c-teal .th,.c-teal .ts{fill:#085041}rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-gray rect,.c-gray circle,.c-gray ellipse,.c-gray polygon,.c-gray path{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text,.c-gray .th,.c-gray .ts{fill:#2C2C2A}rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-blue rect,.c-blue circle,.c-blue ellipse,.c-blue polygon,.c-blue path{fill:#E6F1FB;stroke:#185FA5}.c-blue text,.c-blue .th,.c-blue .ts{fill:#0C447C}rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-purple rect,.c-purple circle,.c-purple ellipse,.c-purple polygon,.c-purple path{fill:#EEEDFE;stroke:#534AB7}.c-purple text,.c-purple .th,.c-purple .ts{fill:#3C3489}rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-amber rect,.c-amber circle,.c-amber ellipse,.c-amber polygon,.c-amber path{fill:#FAEEDA;stroke:#BA7517}.c-amber text,.c-amber .th,.c-amber .ts{fill:#633806}rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}.c-green rect,.c-green circle,.c-green ellipse,.c-green polygon,.c-green path{fill:#EAF3DE;stroke:#3B6D11}.c-green text,.c-green .th,.c-green .ts{fill:#27500A}rect.c-green,circle.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-red rect,.c-red circle,.c-red ellipse,.c-red polygon,.c-red path{fill:#FCEBEB;stroke:#A32D2D}.c-red text,.c-red .th,.c-red .ts{fill:#791F1F}rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-pink rect,.c-pink circle,.c-pink ellipse,.c-pink polygon,.c-pink path{fill:#FBEAF0;stroke:#993556}.c-pink text,.c-pink .th,.c-pink .ts{fill:#72243E}rect.c-pink,circle.c-pink{fill:#FBEAF0;stroke:#993556}</style><rect width="100%" height="100%" fill="#FFFFFF"/><title>ユニゾ争奪戦では、同じフォートレスが友好的から敵対的に変わり、最後は従業員買収が勝った</title><desc>HIS、フォートレス、ブラックストーン、チトセア投資の提案を時系列に並べ、友好的か敵対的かを色で示した年表</desc>
<g class="c-teal"><rect x="440" y="20" width="16" height="16" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="462" y="32">友好的（ユニゾが賛同）</text>
<g class="c-coral"><rect x="440" y="44" width="16" height="16" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="462" y="56">敵対的・同意なし</text>
<line x1="150" y1="80" x2="150" y2="450" stroke="#B4B2A9" stroke-width="1"/>
<text class="ts" x="132" y="104" text-anchor="end">2019年7月</text>
<circle cx="150" cy="100" r="5" fill="#D85A30"/>
<g class="c-coral"><rect x="170" y="80" width="340" height="40" rx="6" stroke-width="0.5"/>
<text class="th" x="186" y="100" dominant-baseline="central">HIS 3100円 敵対的TOB</text></g>
<text class="ts" x="132" y="154" text-anchor="end">2019年8月</text>
<circle cx="150" cy="150" r="5" fill="#1D9E75"/>
<g class="c-teal"><rect x="170" y="130" width="400" height="40" rx="6" stroke-width="0.5"/>
<text class="th" x="186" y="150" dominant-baseline="central">フォートレス 4000円 ホワイトナイトのTOB</text></g>
<text class="ts" x="132" y="204" text-anchor="end">2019年8月</text>
<circle cx="150" cy="200" r="5" fill="#2C2C2A"/>
<g class="c-gray"><rect x="170" y="180" width="340" height="40" rx="6" stroke-width="0.5"/>
<text class="th" x="186" y="200" dominant-baseline="central">HISのTOBは不成立</text></g>
<text class="ts" x="132" y="254" text-anchor="end">2019年秋</text>
<circle cx="150" cy="250" r="5" fill="#D85A30"/>
<g class="c-coral"><rect x="170" y="230" width="400" height="40" rx="6" stroke-width="0.5"/>
<text class="th" x="186" y="250" dominant-baseline="central">ユニゾが賛同撤回 フォートレスは敵対的に</text></g>
<text class="ts" x="132" y="304" text-anchor="end">2019年秋</text>
<circle cx="150" cy="300" r="5" fill="#D85A30"/>
<g class="c-coral"><rect x="170" y="280" width="400" height="40" rx="6" stroke-width="0.5"/>
<text class="th" x="186" y="300" dominant-baseline="central">ブラックストーン 5000円 同意得られず</text></g>
<text class="ts" x="132" y="354" text-anchor="end">2019年秋</text>
<circle cx="150" cy="350" r="5" fill="#D85A30"/>
<g class="c-coral"><rect x="170" y="330" width="400" height="40" rx="6" stroke-width="0.5"/>
<text class="th" x="186" y="350" dominant-baseline="central">フォートレス 5200円に引き上げ 同意なし</text></g>
<text class="ts" x="132" y="414" text-anchor="end">2020年4月</text>
<circle cx="150" cy="410" r="6" fill="#1D9E75"/>
<g class="c-teal"><rect x="170" y="384" width="440" height="52" rx="6" stroke-width="0.5"/>
<text class="th" x="186" y="402" dominant-baseline="central">チトセア投資（従業員＋ローンスター）6000円</text>
<text class="ts" x="186" y="422" dominant-baseline="central">EBOのTOBが成立、争奪戦が終わる</text></g>
</svg>
