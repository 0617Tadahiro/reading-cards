<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 400" role="img"><style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;fill:#2C2C2A}.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.arr{stroke:#73726C;stroke-width:1.5;fill:none}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 4;fill:none}.c-coral rect,.c-coral circle,.c-coral ellipse,.c-coral polygon,.c-coral path{fill:#FAECE7;stroke:#D85A30}.c-coral text,.c-coral .th,.c-coral .ts{fill:#712B13}rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}.c-teal rect,.c-teal circle,.c-teal ellipse,.c-teal polygon,.c-teal path{fill:#E1F5EE;stroke:#0F6E56}.c-teal text,.c-teal .th,.c-teal .ts{fill:#085041}rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-gray rect,.c-gray circle,.c-gray ellipse,.c-gray polygon,.c-gray path{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text,.c-gray .th,.c-gray .ts{fill:#2C2C2A}rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-blue rect,.c-blue circle,.c-blue ellipse,.c-blue polygon,.c-blue path{fill:#E6F1FB;stroke:#185FA5}.c-blue text,.c-blue .th,.c-blue .ts{fill:#0C447C}rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-purple rect,.c-purple circle,.c-purple ellipse,.c-purple polygon,.c-purple path{fill:#EEEDFE;stroke:#534AB7}.c-purple text,.c-purple .th,.c-purple .ts{fill:#3C3489}rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-amber rect,.c-amber circle,.c-amber ellipse,.c-amber polygon,.c-amber path{fill:#FAEEDA;stroke:#BA7517}.c-amber text,.c-amber .th,.c-amber .ts{fill:#633806}rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}.c-green rect,.c-green circle,.c-green ellipse,.c-green polygon,.c-green path{fill:#EAF3DE;stroke:#3B6D11}.c-green text,.c-green .th,.c-green .ts{fill:#27500A}rect.c-green,circle.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-red rect,.c-red circle,.c-red ellipse,.c-red polygon,.c-red path{fill:#FCEBEB;stroke:#A32D2D}.c-red text,.c-red .th,.c-red .ts{fill:#791F1F}rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-pink rect,.c-pink circle,.c-pink ellipse,.c-pink polygon,.c-pink path{fill:#FBEAF0;stroke:#993556}.c-pink text,.c-pink .th,.c-pink .ts{fill:#72243E}rect.c-pink,circle.c-pink{fill:#FBEAF0;stroke:#993556}</style><rect width="100%" height="100%" fill="#FFFFFF"/><title>『敵対的買収とアクティビスト』は、基礎→歴史→攻防の道具→各国ルール→将来の順に進む</title><desc>第1・2章で攻める側の正体を押さえ、第3章で歴史、第4・5章で防衛策と法規制、第6章で将来像を扱う構造図</desc>
