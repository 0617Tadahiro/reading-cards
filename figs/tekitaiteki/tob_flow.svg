<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 470" role="img"><style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;fill:#2C2C2A}.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.arr{stroke:#73726C;stroke-width:1.5;fill:none}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 4;fill:none}.c-coral rect,.c-coral circle,.c-coral ellipse,.c-coral polygon,.c-coral path{fill:#FAECE7;stroke:#D85A30}.c-coral text,.c-coral .th,.c-coral .ts{fill:#712B13}rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}.c-teal rect,.c-teal circle,.c-teal ellipse,.c-teal polygon,.c-teal path{fill:#E1F5EE;stroke:#0F6E56}.c-teal text,.c-teal .th,.c-teal .ts{fill:#085041}rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-gray rect,.c-gray circle,.c-gray ellipse,.c-gray polygon,.c-gray path{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text,.c-gray .th,.c-gray .ts{fill:#2C2C2A}rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-blue rect,.c-blue circle,.c-blue ellipse,.c-blue polygon,.c-blue path{fill:#E6F1FB;stroke:#185FA5}.c-blue text,.c-blue .th,.c-blue .ts{fill:#0C447C}rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-purple rect,.c-purple circle,.c-purple ellipse,.c-purple polygon,.c-purple path{fill:#EEEDFE;stroke:#534AB7}.c-purple text,.c-purple .th,.c-purple .ts{fill:#3C3489}rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-amber rect,.c-amber circle,.c-amber ellipse,.c-amber polygon,.c-amber path{fill:#FAEEDA;stroke:#BA7517}.c-amber text,.c-amber .th,.c-amber .ts{fill:#633806}rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}.c-green rect,.c-green circle,.c-green ellipse,.c-green polygon,.c-green path{fill:#EAF3DE;stroke:#3B6D11}.c-green text,.c-green .th,.c-green .ts{fill:#27500A}rect.c-green,circle.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-red rect,.c-red circle,.c-red ellipse,.c-red polygon,.c-red path{fill:#FCEBEB;stroke:#A32D2D}.c-red text,.c-red .th,.c-red .ts{fill:#791F1F}rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-pink rect,.c-pink circle,.c-pink ellipse,.c-pink polygon,.c-pink path{fill:#FBEAF0;stroke:#993556}.c-pink text,.c-pink .th,.c-pink .ts{fill:#72243E}rect.c-pink,circle.c-pink{fill:#FBEAF0;stroke:#993556}</style><rect width="100%" height="100%" fill="#FFFFFF"/><title>TOBは、応募が下限に届かなければ1株も買わずに終わる</title><desc>買付者の公告から、対象会社の意見表明、応募期間を経て、下限未満・下限から上限・上限超の3つの結果に分かれる流れ図</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="200" y="30" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">買付者がTOBを公告</text>
<text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">価格・期間・下限・上限</text></g>
<line x1="340" y1="86" x2="340" y2="114" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="200" y="116" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="136" text-anchor="middle" dominant-baseline="central">対象会社の意見表明</text>
<text class="ts" x="340" y="156" text-anchor="middle" dominant-baseline="central">賛同なら友好的、反対なら敵対的</text></g>
<line x1="340" y1="172" x2="340" y2="200" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="200" y="202" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="222" text-anchor="middle" dominant-baseline="central">応募期間</text>
<text class="ts" x="340" y="242" text-anchor="middle" dominant-baseline="central">株主が売るか持つかを判断</text></g>
<path d="M280 258 L280 280 L130 280 L130 310" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="258" x2="340" y2="310" class="arr" marker-end="url(#arrow)"/>
<path d="M400 258 L400 280 L550 280 L550 310" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="40" y="312" width="180" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="336" text-anchor="middle" dominant-baseline="central">下限に届かない</text>
<text class="ts" x="130" y="370" text-anchor="middle" dominant-baseline="central">不成立</text>
<text class="ts" x="130" y="392" text-anchor="middle" dominant-baseline="central">1株も買わない</text>
<text class="ts" x="130" y="414" text-anchor="middle" dominant-baseline="central">株は株主に返却</text></g>
<g class="c-teal"><rect x="250" y="312" width="180" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="336" text-anchor="middle" dominant-baseline="central">下限〜上限</text>
<text class="ts" x="340" y="370" text-anchor="middle" dominant-baseline="central">成立</text>
<text class="ts" x="340" y="392" text-anchor="middle" dominant-baseline="central">応募分を全部買う</text></g>
<g class="c-teal"><rect x="460" y="312" width="180" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="336" text-anchor="middle" dominant-baseline="central">上限を超えた</text>
<text class="ts" x="550" y="370" text-anchor="middle" dominant-baseline="central">成立</text>
<text class="ts" x="550" y="392" text-anchor="middle" dominant-baseline="central">全員から同じ割合で</text>
<text class="ts" x="550" y="414" text-anchor="middle" dominant-baseline="central">買う（按分比例）</text></g>
</svg>
