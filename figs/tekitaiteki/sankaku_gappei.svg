<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 430" role="img"><style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;fill:#2C2C2A}.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.arr{stroke:#73726C;stroke-width:1.5;fill:none}.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:4 4;fill:none}.c-coral rect,.c-coral circle,.c-coral ellipse,.c-coral polygon,.c-coral path{fill:#FAECE7;stroke:#D85A30}.c-coral text,.c-coral .th,.c-coral .ts{fill:#712B13}rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#D85A30}.c-teal rect,.c-teal circle,.c-teal ellipse,.c-teal polygon,.c-teal path{fill:#E1F5EE;stroke:#0F6E56}.c-teal text,.c-teal .th,.c-teal .ts{fill:#085041}rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-gray rect,.c-gray circle,.c-gray ellipse,.c-gray polygon,.c-gray path{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text,.c-gray .th,.c-gray .ts{fill:#2C2C2A}rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-blue rect,.c-blue circle,.c-blue ellipse,.c-blue polygon,.c-blue path{fill:#E6F1FB;stroke:#185FA5}.c-blue text,.c-blue .th,.c-blue .ts{fill:#0C447C}rect.c-blue,circle.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-purple rect,.c-purple circle,.c-purple ellipse,.c-purple polygon,.c-purple path{fill:#EEEDFE;stroke:#534AB7}.c-purple text,.c-purple .th,.c-purple .ts{fill:#3C3489}rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-amber rect,.c-amber circle,.c-amber ellipse,.c-amber polygon,.c-amber path{fill:#FAEEDA;stroke:#BA7517}.c-amber text,.c-amber .th,.c-amber .ts{fill:#633806}rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#BA7517}.c-green rect,.c-green circle,.c-green ellipse,.c-green polygon,.c-green path{fill:#EAF3DE;stroke:#3B6D11}.c-green text,.c-green .th,.c-green .ts{fill:#27500A}rect.c-green,circle.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-red rect,.c-red circle,.c-red ellipse,.c-red polygon,.c-red path{fill:#FCEBEB;stroke:#A32D2D}.c-red text,.c-red .th,.c-red .ts{fill:#791F1F}rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-pink rect,.c-pink circle,.c-pink ellipse,.c-pink polygon,.c-pink path{fill:#FBEAF0;stroke:#993556}.c-pink text,.c-pink .th,.c-pink .ts{fill:#72243E}rect.c-pink,circle.c-pink{fill:#FBEAF0;stroke:#993556}</style><rect width="100%" height="100%" fill="#FFFFFF"/><title>三角合併なら、外国会社は日本に子会社を作るだけで自社株を対価に日本企業を買収できる</title><desc>海外の買収会社が日本に作ったSPCに自社株を持たせ、SPCが対象会社を吸収合併し、対象会社の株主には親会社株式が渡る三角形の構造図</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="30" y="20" width="620" height="110" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="46" y="40">海外</text>
<rect x="30" y="150" width="620" height="260" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="46" y="170">日本</text>
<g class="c-coral"><rect x="240" y="50" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central">買収会社（親会社）</text>
<text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">外国の会社</text></g>
<line x1="300" y1="106" x2="200" y2="196" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="146">①SPCを作り</text>
<text class="ts" x="140" y="162">自社株を持たせる</text>
<g class="c-coral"><rect x="90" y="198" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="218" text-anchor="middle" dominant-baseline="central">SPC（子会社）</text>
<text class="ts" x="180" y="238" text-anchor="middle" dominant-baseline="central">日本に設立</text></g>
<g class="c-teal"><rect x="410" y="198" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="218" text-anchor="middle" dominant-baseline="central">対象会社</text>
<text class="ts" x="500" y="238" text-anchor="middle" dominant-baseline="central">日本の上場会社</text></g>
<line x1="408" y1="226" x2="272" y2="226" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="214" text-anchor="middle">②吸収合併</text>
<g class="c-gray"><rect x="410" y="330" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="350" text-anchor="middle" dominant-baseline="central">対象会社の株主</text>
<text class="ts" x="500" y="370" text-anchor="middle" dominant-baseline="central">対象会社の株を手放す</text></g>
<path d="M180 254 L180 358 L408 358" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="300">③対価として</text>
<text class="ts" x="196" y="316">親会社の株式を渡す</text>
</svg>
