<path d="M560 164 L590 196" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="330" y="200" width="160" height="64" rx="8" stroke-width="0.5"/><text class="th" x="410" y="222" text-anchor="middle" dominant-baseline="central">小規模校</text><text class="ts" x="410" y="244" text-anchor="middle" dominant-baseline="central">基金立グラマー</text></g>
<g class="c-coral"><rect x="500" y="200" width="160" height="64" rx="8" stroke-width="0.5"/><text class="th" x="580" y="222" text-anchor="middle" dominant-baseline="central">大規模・名門</text><text class="ts" x="580" y="244" text-anchor="middle" dominant-baseline="central">パブリックスクール</text></g>
