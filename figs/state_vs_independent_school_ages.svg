<text class="th" x="30" y="86">公立</text>
<g class="c-teal"><rect x="140" y="62" width="160" height="44" rx="6" stroke-width="0.5"/><text class="t" x="220" y="84" text-anchor="middle" dominant-baseline="central">初等学校</text></g>
<g class="c-teal"><rect x="300" y="62" width="260" height="44" rx="6" stroke-width="0.5"/><text class="t" x="430" y="84" text-anchor="middle" dominant-baseline="central">中等学校（11歳〜）</text></g>
<text class="th" x="30" y="166">私立</text>
<g class="c-coral"><rect x="140" y="142" width="240" height="44" rx="6" stroke-width="0.5"/><text class="t" x="260" y="164" text-anchor="middle" dominant-baseline="central">準備学校（プレップ）</text></g>
<g class="c-coral"><rect x="380" y="142" width="180" height="44" rx="6" stroke-width="0.5"/><text class="t" x="470" y="164" text-anchor="middle" dominant-baseline="central">パブリックスクール</text></g>
<text class="ts" x="340" y="226" text-anchor="middle">入口で2年のずれ。私立は13歳まで準備学校で受験に備える</text>
