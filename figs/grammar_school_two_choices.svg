<svg width="680" height="330" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 330" role="img"><title>グラマースクールの二つの選択肢</title><desc>政府の予算も管理も受けない有料の独立グラマースクールになるか、予算と管理を受ける無料の公立グラマースクールに残るか。前者は授業料で教員、施設、課外活動が充実し、後者は限られた予算で運営する</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="220" y="20" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">公立グラマースクール</text><text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">三分岐制度の廃止で選択を迫られる</text></g>
<path d="M290 76 L180 108" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M390 76 L500 108" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="40" y="112" width="280" height="190" rx="10" stroke-width="0.5"/>
<text class="th" x="180" y="136" text-anchor="middle" dominant-baseline="central">独立（私立・有料）</text>
<text class="ts" x="180" y="162" text-anchor="middle" dominant-baseline="central">政府の予算も管理も受けない</text>
<text class="ts" x="180" y="182" text-anchor="middle" dominant-baseline="central">授業料はパブリックスクール並み</text>
<text class="ts" x="180" y="214" text-anchor="middle" dominant-baseline="central">教員数・教科数が多い</text>
<text class="ts" x="180" y="234" text-anchor="middle" dominant-baseline="central">施設・グラウンド・プロの指導者</text>
<text class="ts" x="180" y="254" text-anchor="middle" dominant-baseline="central">課外活動が充実</text>
<text class="th" x="180" y="284" text-anchor="middle" dominant-baseline="central">PS並みの環境</text></g>
<g class="c-teal"><rect x="360" y="112" width="280" height="190" rx="10" stroke-width="0.5"/>
<text class="th" x="500" y="136" text-anchor="middle" dominant-baseline="central">公立のまま（無料）</text>
<text class="ts" x="500" y="162" text-anchor="middle" dominant-baseline="central">政府の予算と管理を受ける</text>
<text class="ts" x="500" y="182" text-anchor="middle" dominant-baseline="central">授業料なし</text>
<text class="ts" x="500" y="214" text-anchor="middle" dominant-baseline="central">教員1人の追加も厳しい</text>
<text class="ts" x="500" y="234" text-anchor="middle" dominant-baseline="central">限られた原資</text>
<text class="ts" x="500" y="254" text-anchor="middle" dominant-baseline="central">課外活動に限界</text>
<text class="th" x="500" y="284" text-anchor="middle" dominant-baseline="central">映画のカトラーズ校</text></g>
</svg>