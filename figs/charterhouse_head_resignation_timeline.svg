<line x1="150" y1="40" x2="150" y2="270" stroke="var(--b)" stroke-width="1"/>
<g><circle cx="150" cy="50" r="6" fill="#888780"/><text class="ts" x="130" y="54" text-anchor="end">2013年</text><text class="th" x="170" y="54">フレミング校長が就任</text></g>
<g><circle cx="150" cy="96" r="6" fill="#BA7517"/><text class="ts" x="130" y="100" text-anchor="end">在任中</text><text class="th" x="170" y="100">厳しい規律と横暴への非難が集まる</text></g>
<g><circle cx="150" cy="142" r="6" fill="#BA7517"/><text class="ts" x="130" y="146" text-anchor="end">↓</text><text class="th" x="170" y="146">在校生と保護者が退任を求める運動</text></g>
<g><circle cx="150" cy="188" r="6" fill="#D85A30"/><text class="ts" x="130" y="192" text-anchor="end">↓</text><text class="th" x="170" y="192">反旗を翻した教員9人・ハウスマスター2人が辞職</text></g>
<g><circle cx="150" cy="234" r="6" fill="#D85A30"/><text class="ts" x="130" y="238" text-anchor="end">2016年9月</text><text class="th" x="170" y="238">デイリー・メールが辞任を報道</text></g>
<g><circle cx="150" cy="270" r="6" fill="#888780"/><text class="ts" x="130" y="274" text-anchor="end">2017年</text><text class="th" x="170" y="274">退任（在任わずか4年）</text></g>
</svg>