<svg width="680" height="300" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 300" role="img"><title>騎士道型ジェントルマンの徳目</title><desc>キリスト教と騎士道精神を土台に、博愛、忠誠、正義、尊敬、気高さ、勇気、善行、名誉の八つの徳目。そのうえで武勇に加え、礼儀正しさ、誠実、慈悲、寛容が求められる</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill