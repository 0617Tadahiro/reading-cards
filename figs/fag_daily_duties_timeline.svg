<svg width="680" height="230" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 230" role="img"><title>ファグの一日</title><desc>早朝は薪で部屋を温め洗顔の湯を運ぶ、朝は朝食の準備と食器磨き、日中は靴や制服のブラシ掛け・掃除・使い走り、午後は紅茶と菓子、夜は自室で食べる監督生の夕食準備、就寝前は体温でベッドを温める</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<text class="th" x="40" y="30">ファグの一日：朝から寝る前まで</text>
<line x1="60" y1="110" x2="620" y2="110" stroke="var(--b)" stroke-width="1.5"/>
<circle cx="80" cy="110" r="7" fill="#888780"/><text class="th" x="80" y="88" text-anchor="middle">早朝</text><text class="ts" x="80" y="140" text-anchor="middle">薪で部屋を</text><text class="ts" x="80" y="157" text-anchor="middle">温める・湯運び</text>
<circle cx="190" cy="110" r="7" fill="#888780"/><text class="th" x="190" y="88" text-anchor="middle">朝</text><text class="ts" x="190" y="140" text-anchor="middle">朝食の準備</text><text class="ts" x="190" y="157" text-anchor="middle">食器磨き</text>
<circle cx="300" cy="110" r="7" fill="#888780"/><text class="th" x="300" y="88" text-anchor="middle">日中</text><text class="ts" x="300" y="140" text-anchor="middle">靴・制服の手入れ</text><text class="ts" x="300" y="157" text-anchor="middle">掃除・使い走り</text>
<circle cx="410" cy="110" r="7" fill="#888780"/><text class="th" x="410" y="88" text-anchor="middle">午後</text><text class="ts" x="410" y="140" text-anchor="middle">紅茶と</text><text class="ts" x="410" y="157" text-anchor="middle">お菓子</text>
<circle cx="510" cy="110" r="7" fill="#888780"/><text class="th" x="510" y="88" text-anchor="middle">夜</text><text class="ts" x="510" y="140" text-anchor="middle">自室で食べる</text><text class="ts" x="510" y="157" text-anchor="middle">主人の夕食準備</text>
<circle cx="610" cy="110" r="7" fill="#D85A30"/><text class="th" x="610" y="88" text-anchor="middle">就寝前</text><text class="ts" x="610" y="140" text-anchor="middle">体温で</text><text class="ts" x="610" y="157" text-anchor="middle">ベッドを温める</text>
<text class="ts" x="340" y="205" text-anchor="middle">失敗すれば鞭と嫌がらせ。監督生（主人）側の義務はわずか</text>
</svg>