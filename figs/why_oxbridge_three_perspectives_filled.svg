<g class="c-teal"><rect x="160" y="200" width="360" height="90" rx="8" stroke-width="0.5"/><text class="th" x="340" y="222" text-anchor="middle" dominant-baseline="central">生徒（動機はばらばら）</text><text class="ts" x="340" y="246" text-anchor="middle" dominant-baseline="central">成功したい／好きなことをしたい／懐疑的</text><text class="ts" x="340" y="268" text-anchor="middle" dominant-baseline="central">ポズナー＝脱出の扉　ラッジ＝親の希望でしかない</text></g>
