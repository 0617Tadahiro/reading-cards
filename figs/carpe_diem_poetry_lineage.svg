<svg width="680" height="230" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 230" role="img"><title>キーティングが引用した詩の系譜</title><desc>紀元前23年ごろのホラティウス、1648年のヘリック、1892年のホイットマン。いずれも今を生きよというメッセージでつながる</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="40" y1="60" x2="630" y2="60" class="arr" marker-end="url(#arrow)"/>
<circle cx="130" cy="60" r="6" fill="#7F77DD"/><circle cx="340" cy="60" r="6" fill="#1D9E75"/><circle cx="550" cy="60" r="6" fill="#D85A30"/>
<text class="ts" x="130" y="42" text-anchor="middle">前23年ごろ</text>
<text class="ts" x="340" y="42" text-anchor="middle">1648年</text>
<text class="ts" x="550" y="42" text-anchor="middle">1892年</text>
<g class="c-purple"><rect x="40" y="86" width="180" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="108" text-anchor="middle" dominant-baseline="central">ホラティウス</text>
<text class="ts" x="130" y="130" text-anchor="middle" dominant-baseline="central">古代ローマ『歌集』</text>
<text class="ts" x="130" y="152" text-anchor="middle" dominant-baseline="central">その日を摘め</text></g>
<g class="c-teal"><rect x="250" y="86" width="180" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="108" text-anchor="middle" dominant-baseline="central">ヘリック</text>
<text class="ts" x="340" y="130" text-anchor="middle" dominant-baseline="central">英バロック詩人</text>
<text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central">摘めるうちにバラを</text></g>
<g class="c-coral"><rect x="460" y="86" width="180" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="108" text-anchor="middle" dominant-baseline="central">ホイットマン</text>
<text class="ts" x="550" y="130" text-anchor="middle" dominant-baseline="central">米・自由詩</text>
<text class="ts" x="550" y="152" text-anchor="middle" dominant-baseline="central">君も一節を書き加えよ</text></g>
<text class="ts" x="340" y="212" text-anchor="middle">定型詩 → 自由詩へと形を変えながら「今を生きよ」が受け継がれる</text>
</svg>