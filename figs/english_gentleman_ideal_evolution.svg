<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 400" role="img"><title>イギリスのジェントルマン像の変遷</title><desc>12世紀の騎士道型から、14世紀以降のイタリア人文主義と古典教養の流入、16世紀のエラスムスやコレットによる人文主義型ジェントルマンの育成、18世紀の帝国の自負によるイギリス独自の紳士像へ</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<line x1="120" y1="40" x2="120" y2="370" stroke="var(--b)" stroke-width="1"/>
<circle cx="120" cy="56" r="7" fill="#888780"/>
<text class="ts" x="100" y="60" text-anchor="end">12世紀</text>
<g class="c-gray"><rect x="140" y="32" width="500" height="50" rx="8" stroke-width="0.5"/><text class="th" x="160" y="50" dominant-baseline="central">騎士道型</text><text class="ts" x="160" y="68" dominant-baseline="central">アーサー王伝説、キリスト教＋騎士道、武勇が中心</text></g>
<circle cx="120" cy="136" r="7" fill="#7F77DD"/>
<text class="ts" x="100" y="140" text-anchor="end">14世紀〜</text>
<g class="c-purple"><rect x="140" y="112" width="500" height="50" rx="8" stroke-width="0.5"/><text class="th" x="160" y="130" dominant-baseline="central">教養が基準に</text><text class="ts" x="160" y="148" dominant-baseline="central">伊ヒューマニズム・古典教養・仏流の洗練、無教養な騎士は尊敬を失う</text></g>
<circle cx="120" cy="216" r="7" fill="#1D9E75"/>
<text class="ts" x="100" y="220" text-anchor="end">16世紀</text>
<g class="c-teal"><rect x="140" y="192" width="500" height="50" rx="8" stroke-width="0.5"/><text class="th" x="160" y="210" dominant-baseline="central">人文主義型</text><text class="ts" x="160" y="228" dominant-baseline="central">エラスムス・コレット、セント・ポールズ創設、隣人愛を土台に</text></g>
<circle cx="120" cy="296" r="7" fill="#1D9E75"/>
<text class="ts" x="100" y="300" text-anchor="end">宗教改革</text>
<g class="c-teal"><rect x="140" y="272" width="500" height="50" rx="8" stroke-width="0.5"/><text class="th" x="160" y="290" dominant-baseline="central">学校の独立性が高まる</text><text class="ts" x="160" y="308" dominant-baseline="central">教会支配が弱まり、聖職者養成の役割が後退</text></g>
<circle cx="120" cy="362" r="7" fill="#D85A30"/>
<text class="ts" x="100" y="366" text-anchor="end">18世紀</text>
<g class="c-coral"><rect x="140" y="340" width="500" height="50" rx="8" stroke-width="0.5"/><text class="th" x="160" y="358" dominant-baseline="central">イギリス独自の紳士像</text><text class="ts" x="160" y="376" dominant-baseline="central">帝国の自負、パブリックスクールが形成を担う</text></g>
</svg>