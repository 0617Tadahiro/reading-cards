<svg width="680" height="470" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 470" role="img"><title>イギリスの学校形態の全体像（第5章前半まで）</title><desc>公立系は5歳から11歳の初等学校、11歳試験でグラマー、テクニカル、モダンの三つの中等学校に分かれる。私立系は準備学校を経て13歳でパブリックスクールへ。私立には小規模な基金立グラマースクールもある。最後は全員がAレベルを経て大学へ向かう</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="190" y="30" text-anchor="middle">公立（国の補助・管理あり、大半無償）</text>
<text class="th" x="530" y="30" text-anchor="middle">私立（補助も管理もなし）</text>
<line x1="380" y1="40" x2="380" y2="380" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<g class="c-gray"><rect x="60" y="50" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="190" y="68" text-anchor="middle" dominant-baseline="central">初等学校</text><text class="ts" x="190" y="86" text-anchor="middle" dominant-baseline="central">5〜11歳</text></g>
<line x1="190" y1="98" x2="190" y2="124" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="90" y="128" width="200" height="36" rx="8" stroke-width="0.5"/><text class="th" x="190" y="146" text-anchor="middle" dominant-baseline="central">11歳試験（11+）</text></g>
<line x1="150" y1="164" x2="85" y2="196" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="164" x2="190" y2="196" class="arr" marker-end="url(#arrow)"/>
<line x1="230" y1="164" x2="295" y2="196" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="20" y="200" width="120" height="76" rx="8" stroke-width="0.5"/><text class="th" x="80" y="222" text-anchor="middle" dominant-baseline="central">グラマー</text><text class="ts" x="80" y="244" text-anchor="middle" dominant-baseline="central">上位15〜20%</text><text class="ts" x="80" y="262" text-anchor="middle" dominant-baseline="central">大学進学</text></g>
<g class="c-gray"><rect x="130" y="290" width="120" height="76" rx="8" stroke-width="0.5"/><text class="th" x="190" y="312" text-anchor="middle" dominant-baseline="central">テクニカル</text><text class="ts" x="190" y="334" text-anchor="middle" dominant-baseline="central">10%未満</text><text class="ts" x="190" y="352" text-anchor="middle" dominant-baseline="central">技術教育</text></g>
<g class="c-gray"><rect x="240" y="200" width="120" height="76" rx="8" stroke-width="0.5"/><text class="th" x="300" y="222" text-anchor="middle" dominant-baseline="central">モダン</text><text class="ts" x="300" y="244" text-anchor="middle" dominant-baseline="central">70%以上</text><text class="ts" x="300" y="262" text-anchor="middle" dominant-baseline="central">一般教養</text></g>
<line x1="190" y1="196" x2="190" y2="286" stroke="var(--t)" stroke-width="0.5"/>
<g class="c-coral"><rect x="420" y="50" width="220" height="48" rx="8" stroke-width="0.5"/><text class="th" x="530" y="68" text-anchor="middle" dominant-baseline="central">準備学校（プレップ）</text><text class="ts" x="530" y="86" text-anchor="middle" dominant-baseline="central">〜13歳</text></g>
<line x1="530" y1="98" x2="530" y2="124" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="420" y="128" width="220" height="90" rx="8" stroke-width="0.5"/><text class="th" x="530" y="150" text-anchor="middle" dominant-baseline="central">パブリックスクール</text><text class="ts" x="530" y="172" text-anchor="middle" dominant-baseline="central">13〜18歳・寄宿制</text><text class="ts" x="530" y="190" text-anchor="middle" dominant-baseline="central">基金立グラマーの名門</text><text class="ts" x="530" y="206" text-anchor="middle" dominant-baseline="central">頂点がザ・ナイン</text></g>
<g class="c-coral"><rect x="420" y="232" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="252" text-anchor="middle" dominant-baseline="central">小規模な基金立</text><text class="th" x="530" y="272" text-anchor="middle" dominant-baseline="central">グラマースクール</text></g>
<g class="c-purple"><rect x="140" y="398" width="400" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="418" text-anchor="middle" dominant-baseline="central">Aレベル（私立の一部はプレU）</text><text class="ts" x="340" y="438" text-anchor="middle" dominant-baseline="central">→ 大学独自の二次試験 → 大学</text></g>
<path d="M80 276 L80 380 L250 396" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M530 218 L600 226" fill="none" stroke="none"/>
