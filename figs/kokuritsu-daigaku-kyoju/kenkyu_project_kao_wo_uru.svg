<text class="ts" x="105" y="158" text-anchor="middle" dominant-baseline="central">チームの外</text></g>
<line x1="190" y1="145" x2="226" y2="145" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
