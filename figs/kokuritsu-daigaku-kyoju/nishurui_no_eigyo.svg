<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="240" y="20" width="200" height="50" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="45" text-anchor="middle" dominant-baseline="central">大学教員の営業</text></g>
<path d="M290 70 L290 95 L170 95 L170 116" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M390 70 L390 95 L510 95 L510 116" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="50" y="120" width="240" height="110" rx="12" stroke-width="0.5"/>
<text class="th" x="170" y="146" text-anchor="middle" dominant-baseline="central">組織を売る</text>
<text class="ts" x="170" y="176" text-anchor="middle" dominant-baseline="central">大学・部局・学会</text>
<text class="ts" x="170" y="202" text-anchor="middle" dominant-baseline="central">→ 学生・資金・評判</text></g>
<g class="c-purple"><rect x="390" y="120" width="240" height="110" rx="12" stroke-width="0.5"/>
<text class="th" x="510" y="146" text-anchor="middle" dominant-baseline="central">自分を売る</text>
<text class="ts" x="510" y="176" text-anchor="middle" dominant-baseline="central">個人としての研究者</text>
<text class="ts" x="510" y="202" text-anchor="middle" dominant-baseline="central">→ 研究機会・出版・仕事</text></g>
