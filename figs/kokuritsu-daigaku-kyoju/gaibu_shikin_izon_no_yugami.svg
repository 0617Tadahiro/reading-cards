<svg width="680" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img"><style>:root{--purple:#7F77DD;--coral:#D85A30;--teal:#1D9E75;--blue:#378ADD;--amber:#BA7517;--green:#639922;--red:#E24B4A;--gray:#888780}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}text{fill:#233A5C}</style><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style><title>外部資金への依存は、時間・分野・世代の三方向にゆがみを生む</title><desc>運営費交付金の削減によって外部資金に依存するようになった結果、年限付きのお金のため任期付き雇用が増える時間のゆがみ、応用技術や時事解説にお金が集まり基礎研究や実証研究・オーラルヒストリーに回らない分野のゆがみ、ノウハウとネットワークのあるベテランが有利で若手が不利になる世代のゆがみ、の三つが生じることを示した構造図</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="200" y="20" width="280" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">運営費交付金の削減</text>
<text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">→ 外部資金に依存</text></g>
<path d="M260 76 L260 100 L115 100 L115 126" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="76" x2="340" y2="126" class="arr" marker-end="url(#arrow)"/>
<path d="M420 76 L420 100 L565 100 L565 126" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="20" y="130" width="190" height="150" rx="12" stroke-width="0.5"/>
<text class="th" x="115" y="156" text-anchor="middle" dominant-baseline="central">時間のゆがみ</text>
<text class="ts" x="115" y="192" text-anchor="middle" dominant-baseline="central">お金は1〜数年で切れる</text>
<text class="ts" x="115" y="218" text-anchor="middle" dominant-baseline="central">テニュアで雇えない</text>
<text class="ts" x="115" y="244" text-anchor="middle" dominant-baseline="central">任期付き・雇い止め</text></g>
<g class="c-coral"><rect x="245" y="130" width="190" height="150" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="156" text-anchor="middle" dominant-baseline="central">分野のゆがみ</text>
<text class="ts" x="340" y="192" text-anchor="middle" dominant-baseline="central">応用・時事解説に集中</text>
<text class="ts" x="340" y="218" text-anchor="middle" dominant-baseline="central">基礎研究・実証研究</text>
<text class="ts" x="340" y="244" text-anchor="middle" dominant-baseline="central">オーラルヒストリーが痩せる</text></g>
<g class="c-coral"><rect x="470" y="130" width="190" height="150" rx="12" stroke-width="0.5"/>
<text class="th" x="565" y="156" text-anchor="middle" dominant-baseline="central">世代のゆがみ</text>
<text class="ts" x="565" y="192" text-anchor="middle" dominant-baseline="central">ベテランはノウハウと人脈</text>
<text class="ts" x="565" y="218" text-anchor="middle" dominant-baseline="central">若手は書き方も知らない</text>
<text class="ts" x="565" y="244" text-anchor="middle" dominant-baseline="central">研究の価値と無関係な差</text></g>
<text class="ts" x="340" y="305" text-anchor="middle">いずれも「研究の価値」とは別の基準でお金が配られる</text>
</svg>