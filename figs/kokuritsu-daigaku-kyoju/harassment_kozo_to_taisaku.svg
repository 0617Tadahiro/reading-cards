<text class="ts" x="570" y="96" text-anchor="middle" dominant-baseline="central">委員会の人選</text>
<text class="ts" x="570" y="130" text-anchor="middle" dominant-baseline="central">声を上げやすく</text>
<text class="ts" x="570" y="164" text-anchor="middle" dominant-baseline="central">人間関係の修復</text>
<text class="ts" x="570" y="198" text-anchor="middle" dominant-baseline="central">復帰しやすい環境</text>
<text class="ts" x="570" y="242" text-anchor="middle" dominant-baseline="central">予防：部屋を出て</text>
<text class="ts" x="570" y="262" text-anchor="middle" dominant-baseline="central">現場で情報を集める</text></g>
