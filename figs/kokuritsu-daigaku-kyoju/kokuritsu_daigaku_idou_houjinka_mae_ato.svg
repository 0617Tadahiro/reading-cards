<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="170" y="28" text-anchor="middle">2004年の法人化前</text>
<text class="th" x="510" y="28" text-anchor="middle">法人化後</text>
<g class="c-gray"><rect x="30" y="45" width="280" height="170" rx="14" stroke-width="0.5"/>
<text class="th" x="170" y="70" text-anchor="middle" dominant-baseline="central">文部省（一つの組織）</text></g>
<g class="c-teal"><rect x="55" y="110" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="105" y="138" text-anchor="middle" dominant-baseline="central">愛媛大</text></g>
<g class="c-purple"><rect x="185" y="110" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="235" y="138" text-anchor="middle" dominant-baseline="central">神戸大</text></g>
<line x1="155" y1="138" x2="181" y2="138" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="170" y="192" text-anchor="middle">転勤扱い：勤務歴は通算</text>
<g class="c-teal"><rect x="380" y="110" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="430" y="132" text-anchor="middle" dominant-baseline="central">A大学</text><text class="ts" x="430" y="152" text-anchor="middle" dominant-baseline="central">法人</text></g>
<g class="c-purple"><rect x="560" y="110" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="610" y="132" text-anchor="middle" dominant-baseline="central">B大学</text><text class="ts" x="610" y="152" text-anchor="middle" dominant-baseline="central">法人</text></g>
<line x1="480" y1="138" x2="556" y2="138" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="518" y="128" text-anchor="middle">退職→採用</text>
<text class="ts" x="520" y="192" text-anchor="middle">転職扱い：原則は勤務歴が切れる</text>
<text class="ts" x="520" y="212" text-anchor="middle">（規程で通算する例外あり）</text>
</svg>