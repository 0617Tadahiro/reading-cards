<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="400" y="20" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="525" y="40" text-anchor="middle" dominant-baseline="central">本部の事務局</text>
<text class="ts" x="525" y="60" text-anchor="middle" dominant-baseline="central">採用・配属・異動を管理</text></g>
<rect x="20" y="100" width="640" height="210" rx="14" fill="none" stroke="var(--b)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="ts" x="40" y="122">部局（例：研究科）</text>
<g class="c-purple"><rect x="40" y="140" width="250" height="140" rx="10" stroke-width="0.5"/>
<text class="th" x="165" y="166" text-anchor="middle" dominant-baseline="central">教員組織</text>
<text class="ts" x="165" y="196" text-anchor="middle" dominant-baseline="central">部局長・教授会</text>
<text class="ts" x="165" y="226" text-anchor="middle" dominant-baseline="central">「政治家」：決める</text>
<text class="ts" x="165" y="252" text-anchor="middle" dominant-baseline="central">研究・教育も担う</text></g>
<g class="c-teal"><rect x="400" y="140" width="250" height="140" rx="10" stroke-width="0.5"/>
<text class="th" x="525" y="166" text-anchor="middle" dominant-baseline="central">事務組織</text>
<text class="ts" x="525" y="196" text-anchor="middle" dominant-baseline="central">事務長・事務職員</text>
<text class="ts" x="525" y="226" text-anchor="middle" dominant-baseline="central">「官僚」：実行する</text>
<text class="ts" x="525" y="252" text-anchor="middle" dominant-baseline="central">規則・前例・予算の専門家</text></g>
<line x1="525" y1="76" x2="525" y2="136" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="535" y="108" text-anchor="start">指揮・人事</text>
<line x1="294" y1="200" x2="396" y2="200" class="arr" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text class="ts" x="345" y="190" text-anchor="middle">パートナー</text>
<text class="ts" x="345" y="222" text-anchor="middle">上下関係なし</text>
</svg>