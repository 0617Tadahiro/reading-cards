<text class="ts" x="565" y="170" text-anchor="middle" dominant-baseline="central">書類・執行・報告</text></g>
<g class="c-coral"><rect x="250" y="250" width="180" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="270" text-anchor="middle" dominant-baseline="central">既存の人では回らない</text>
<text class="ts" x="340" y="290" text-anchor="middle" dominant-baseline="central">教員・職員の行政が増加</text></g>
<g class="c-teal"><rect x="20" y="130" width="190" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="115" y="150" text-anchor="middle" dominant-baseline="central">担当職員を雇いたい</text>
<text class="ts" x="115" y="170" text-anchor="middle" dominant-baseline="central">→別の外部資金の申請書</text></g>
