<svg width="680" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img"><style>:root{--purple:#7F77DD;--coral:#D85A30;--teal:#1D9E75;--blue:#378ADD;--amber:#BA7517;--green:#639922;--red:#E24B4A;--gray:#888780}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}text{fill:#233A5C}</style><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style><title>留学生の奨学金は3ルート、教員が「枠」を取りに行くのは大学枠</title><desc>国費留学生（大使館推薦・大学推薦、入学前に選考、全体の約3%）、財団などの民間奨学金（本人が申請し教員は推薦状のみ）、大学ごとの枠（JDS、JICA長期研修、ADBなど。教員が申請・交渉・現地選考まで担当）の3つのルートを、教員の関与の度合いとともに示す図</desc>
<text class="th" x="340" y="28" text-anchor="middle">留学生の奨学金</text>
<g class="c-blue"><rect x="30" y="50" width="190" height="130" rx="10" stroke-width="0.5"/>
<text class="th" x="125" y="76" text-anchor="middle">国費留学生</text>
<text class="ts" x="125" y="104" text-anchor="middle">大使館推薦／大学推薦</text>
<text class="ts" x="125" y="126" text-anchor="middle">入学前に選考</text>
<text class="ts" x="125" y="148" text-anchor="middle">全体の約3%</text></g>
<g class="c-gray"><rect x="245" y="50" width="190" height="130" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="76" text-anchor="middle">財団などの奨学金</text>
<text class="ts" x="340" y="104" text-anchor="middle">留学生本人が申請</text>
<text class="ts" x="340" y="126" text-anchor="middle">教員は推薦状を書く</text></g>
<g class="c-teal"><rect x="460" y="50" width="190" height="130" rx="10" stroke-width="0.5"/>
<text class="th" x="555" y="76" text-anchor="middle">大学ごとの枠</text>
<text class="ts" x="555" y="104" text-anchor="middle">JDS・JICA研修・ADB</text>
<text class="ts" x="555" y="126" text-anchor="middle">教員が申請・交渉</text>
<text class="ts" x="555" y="148" text-anchor="middle">現地で選考も担当</text></g>
<text class="ts" x="30" y="222">教員の関与</text>
<rect x="30" y="234" width="620" height="14" rx="7" fill="var(--b)" opacity="0.25"/>
<rect class="c-blue" x="30" y="234" width="190" height="14" rx="7" stroke-width="0"/>
<rect class="c-gray" x="245" y="234" width="80" height="14" rx="7" stroke-width="0"/>
<rect class="c-teal" x="460" y="234" width="190" height="14" rx="7" stroke-width="0"/>
<text class="ts" x="125" y="272" text-anchor="middle">大学推薦の申請</text>
<text class="ts" x="340" y="272" text-anchor="middle">小さい</text>
<text class="ts" x="555" y="272" text-anchor="middle">大きい（営業そのもの）</text>
<text class="ts" x="340" y="312" text-anchor="middle">私費で来日した後に国費へ切り替えることはできない</text>
</svg>