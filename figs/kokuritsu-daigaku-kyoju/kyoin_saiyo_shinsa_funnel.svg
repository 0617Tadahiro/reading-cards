<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="90" y="20" width="400" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="290" y="38" text-anchor="middle" dominant-baseline="central">応募</text>
<text class="ts" x="290" y="56" text-anchor="middle" dominant-baseline="central">多ければ100人超</text></g>
<g class="c-gray"><rect x="130" y="90" width="320" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="290" y="108" text-anchor="middle" dominant-baseline="central">書類審査</text>
<text class="ts" x="290" y="126" text-anchor="middle" dominant-baseline="central">代表作5編＋人柄の情報収集</text></g>
<g class="c-teal"><rect x="170" y="160" width="240" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="290" y="178" text-anchor="middle" dominant-baseline="central">面接・模擬授業</text>
<text class="ts" x="290" y="196" text-anchor="middle" dominant-baseline="central">数名、多くて5名</text></g>
<g class="c-teal"><rect x="200" y="230" width="180" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="290" y="248" text-anchor="middle" dominant-baseline="central">審査委員が推薦</text>
<text class="ts" x="290" y="266" text-anchor="middle" dominant-baseline="central">通常1名</text></g>
<g class="c-coral"><rect x="215" y="300" width="150" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="290" y="318" text-anchor="middle" dominant-baseline="central">教授会で可否投票</text>
<text class="ts" x="290" y="336" text-anchor="middle" dominant-baseline="central">無記名・3分の2</text></g>
<g class="c-purple"><rect x="230" y="365" width="120" height="30" rx="8" stroke-width="0.5"/>
<text class="ts" x="290" y="380" text-anchor="middle" dominant-baseline="central">全学会議で承認</text></g>
<line x1="290" y1="70" x2="290" y2="86" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="140" x2="290" y2="156" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="210" x2="290" y2="226" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="280" x2="290" y2="296" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="350" x2="290" y2="361" class="arr" marker-end="url(#arrow)"/>
<path d="M365 325 L560 325 L560 45 L494 45" fill="none" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts" x="570" y="180" text-anchor="start">否決なら</text>
<text class="ts" x="570" y="198" text-anchor="start">振り出し</text>
<text class="ts" x="570" y="216" text-anchor="start">（再公募）</text>
</svg>