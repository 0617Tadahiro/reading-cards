<svg width="680" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img"><style>:root{--purple:#7F77DD;--coral:#D85A30;--teal:#1D9E75;--blue:#378ADD;--amber:#BA7517;--green:#639922;--red:#E24B4A;--gray:#888780}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}text{fill:#233A5C}</style><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style><title>職階は降りないはしご、役職は任期で外れる帽子</title><desc>左に助教・講師・准教授・教授の職階のはしごを置き、教授が最上位で降格がないこと、右に学部長・研究科長・副学長・学長などの役職を置き、任期が終わると平教授に戻ることを示した構造図</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="160" y="26" text-anchor="middle">職階（はしご）</text>
<text class="th" x="520" y="26" text-anchor="middle">役職（帽子）</text>
<g class="c-purple"><rect x="90" y="45" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="160" y="67" text-anchor="middle" dominant-baseline="central">教授</text></g>
<g class="c-teal"><rect x="90" y="110" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="160" y="132" text-anchor="middle" dominant-baseline="central">准教授</text></g>
<g class="c-teal"><rect x="90" y="175" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="160" y="197" text-anchor="middle" dominant-baseline="central">講師（ない所も）</text></g>
<g class="c-gray"><rect x="90" y="240" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="160" y="262" text-anchor="middle" dominant-baseline="central">助教</text></g>
<line x1="160" y1="240" x2="160" y2="158" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="175" x2="160" y2="158" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="110" x2="160" y2="93" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="60" y="170" text-anchor="middle">審査で</text>
<text class="ts" x="60" y="188" text-anchor="middle">昇進</text>
<text class="ts" x="60" y="206" text-anchor="middle">降格なし</text>
<g class="c-coral"><rect x="430" y="45" width="180" height="120" rx="10" stroke-width="0.5"/>
<text class="th" x="520" y="70" text-anchor="middle" dominant-baseline="central">任期付きの役職</text>
<text class="ts" x="520" y="98" text-anchor="middle" dominant-baseline="central">学部長・研究科長</text>
<text class="ts" x="520" y="120" text-anchor="middle" dominant-baseline="central">副学長・学長</text>
<text class="ts" x="520" y="146" text-anchor="middle" dominant-baseline="central">役職手当がつく</text></g>
<line x1="234" y1="62" x2="426" y2="62" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="330" y="54" text-anchor="middle">就任</text>
<path d="M430 140 L330 140 L330 78 L234 78" fill="none" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts" x="330" y="160" text-anchor="middle">任期終了→平教授に戻る</text>
</svg>