<text class="ts" x="410" y="88" text-anchor="middle" dominant-baseline="central">約1割減</text></g>
<g class="c-coral"><rect x="500" y="50" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="ts" x="580" y="70" text-anchor="middle" dominant-baseline="central">支出は増える</text>
<text class="ts" x="580" y="88" text-anchor="middle" dominant-baseline="central">高度化・光熱費・消費税</text></g>
<g class="c-purple"><rect x="390" y="150" width="220" height="44" rx="8" stroke-width="0.5"/><text class="ts" x="500" y="172" text-anchor="middle" dominant-baseline="central">差を外部資金で埋める</text></g>
