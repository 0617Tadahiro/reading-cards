<g class="c-gray"><rect x="50" y="150" width="200" height="44" rx="8" stroke-width="0.5"/><text class="ts" x="150" y="172" text-anchor="middle" dominant-baseline="central">だから苦しいのは仕方ない</text></g>
<line x1="150" y1="104" x2="150" y2="146" class="arr" marker-end="url(#arrow)"/>
<line x1="310" y1="40" x2="310" y2="280" stroke="var(--b)" stroke-width="0.5"/>
