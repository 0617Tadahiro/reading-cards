<path d="M580 106 L580 128 L530 128 L530 146" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="340" y="230" width="320" height="44" rx="8" stroke-width="0.5"/><text class="ts" x="500" y="252" text-anchor="middle" dominant-baseline="central">入学者は減っていない・規制で仕事も減らせない</text></g>
<line x1="500" y1="194" x2="500" y2="226" stroke="var(--b)" stroke-width="0.5"/>
