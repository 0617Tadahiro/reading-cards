<svg width="680" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img"><style>:root{--purple:#7F77DD;--coral:#D85A30;--teal:#1D9E75;--blue:#378ADD;--amber:#BA7517;--green:#639922;--red:#E24B4A;--gray:#888780}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}text{fill:#233A5C}</style><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style><title>科研費は個人が取るが、財布は大学</title><desc>研究者個人が研究課題を申請し、日本学術振興会などが審査して採択すると、直接経費とその30%の間接経費が本人ではなく所属大学の会計に入る。直接経費は大学と科研費の両方のルールで研究にだけ使え、間接経費は大学本部や部局の運営費になる、という資金の流れを示した図</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="30" y="30" width="170" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="115" y="50" text-anchor="middle" dominant-baseline="central">研究者個人</text>
<text class="ts" x="115" y="70" text-anchor="middle" dominant-baseline="central">研究課題ごとに申請</text></g>
<g class="c-gray"><rect x="480" y="30" width="170" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="565" y="50" text-anchor="middle" dominant-baseline="central">学振・文科省</text>
<text class="ts" x="565" y="70" text-anchor="middle" dominant-baseline="central">審査（採択率約25%）</text></g>
<line x1="200" y1="58" x2="476" y2="58" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="338" y="48" text-anchor="middle">申請</text>
<path d="M565 86 L565 130 L430 130" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="575" y="112" text-anchor="start">採択</text>
<g class="c-purple"><rect x="250" y="110" width="180" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central">所属大学の会計</text>
<text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">本人の口座ではない</text></g>
<path d="M300 166 L300 200 L170 200 L170 226" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M380 166 L380 200 L510 200 L510 226" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="50" y="230" width="240" height="70" rx="10" stroke-width="0.5"/>
<text class="th" x="170" y="252" text-anchor="middle" dominant-baseline="central">直接経費（100）</text>
<text class="ts" x="170" y="274" text-anchor="middle" dominant-baseline="central">その研究にだけ使える</text>
<text class="ts" x="170" y="290" text-anchor="middle" dominant-baseline="central">飲食不可・備品は大学の資産</text></g>
<g class="c-coral"><rect x="390" y="230" width="240" height="70" rx="10" stroke-width="0.5"/>
<text class="th" x="510" y="252" text-anchor="middle" dominant-baseline="central">間接経費（＋30）</text>
<text class="ts" x="510" y="274" text-anchor="middle" dominant-baseline="central">本部・部局の運営費に</text>
<text class="ts" x="510" y="290" text-anchor="middle" dominant-baseline="central">設備・事務の費用として</text></g>
</svg>