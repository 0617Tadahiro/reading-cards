<text class="th" x="220" y="160" text-anchor="middle" dominant-baseline="central">運営経費</text>
<text class="ts" x="220" y="182" text-anchor="middle" dominant-baseline="central">約1億1500万円</text></g>
<g class="c-teal"><rect x="390" y="140" width="140" height="140" rx="4" stroke-width="0.5"/>
<text class="th" x="460" y="200" text-anchor="middle" dominant-baseline="central">運営経費</text>
<text class="ts" x="460" y="222" text-anchor="middle" dominant-baseline="central">約8500万円</text></g>
<g class="c-coral"><rect x="390" y="80" width="140" height="58" rx="4" stroke-width="0.5"/>
<text class="ts" x="460" y="102" text-anchor="middle" dominant-baseline="central">プロジェクト経費</text>
<text class="ts" x="460" y="120" text-anchor="middle" dominant-baseline="central">約1500万円（使途限定）</text></g>
<rect x="390" y="50" width="140" height="28" rx="4" fill="none" stroke="var(--b)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="ts" x="460" y="64" text-anchor="middle" dominant-baseline="central">総額の減少 約1500万円</text>
<text class="th" x="220" y="302" text-anchor="middle">30年前</text>
<text class="th" x="460" y="302" text-anchor="middle">現在（年1億円弱）</text>
<line x1="545" y1="50" x2="545" y2="138" stroke="var(--b)" stroke-width="0.8"/>
<text class="ts" x="555" y="88" text-anchor="start">自由に使える</text>
<text class="ts" x="555" y="106" text-anchor="start">お金が</text>
<text class="ts" x="555" y="124" text-anchor="start">約3000万円減</text>
</svg>