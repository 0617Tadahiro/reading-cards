<text class="ts" x="105" y="70" text-anchor="middle" dominant-baseline="central">教員＋係長以上の職員</text></g>
<g class="c-coral"><rect x="245" y="30" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">学長選考・監察会議</text>
<text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">学内者・学外者が同数</text></g>
<g class="c-gray"><rect x="490" y="30" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="575" y="50" text-anchor="middle" dominant-baseline="central">文部科学大臣</text>
<text class="ts" x="575" y="70" text-anchor="middle" dominant-baseline="central">形式上の任命権者</text></g>
<line x1="190" y1="58" x2="241" y2="58" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts" x="216" y="104" text-anchor="middle">参考のみ</text>
<g class="c-purple"><rect x="245" y="130" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="150" text-anchor="middle" dominant-baseline="central">学長</text>
<text class="ts" x="340" y="170" text-anchor="middle" dominant-baseline="central">役員会（理事2〜7名）</text></g>
<line x1="340" y1="86" x2="340" y2="126" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="110" text-anchor="start">選考</text>
<path d="M575 86 L575 158 L439 158" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="585" y="125" text-anchor="start">任命</text>
<line x1="340" y1="186" x2="340" y2="210" class="arr"/>
<path d="M120 210 L560 210" fill="none" stroke="var(--b)" stroke-width="0.8"/>
<line x1="120" y1="210" x2="120" y2="236" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="210" x2="340" y2="236" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="210" x2="560" y2="236" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="30" y="240" width="180" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="262" text-anchor="middle" dominant-baseline="central">経営協議会</text>
<text class="ts" x="120" y="284" text-anchor="middle" dominant-baseline="central">学外委員が過半数</text>
<text class="ts" x="120" y="300" text-anchor="middle" dominant-baseline="central">経営面</text></g>
<g class="c-teal"><rect x="250" y="240" width="180" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="262" text-anchor="middle" dominant-baseline="central">教育研究評議会</text>
<text class="ts" x="340" y="284" text-anchor="middle" dominant-baseline="central">学内委員（部局長など）</text>
<text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">教育研究面</text></g>
<g class="c-gray"><rect x="470" y="240" width="180" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="262" text-anchor="middle" dominant-baseline="central">部局長会議</text>
<text class="ts" x="560" y="284" text-anchor="middle" dominant-baseline="central">役員会を補佐</text>
<text class="ts" x="560" y="300" text-anchor="middle" dominant-baseline="central">決定権なし</text></g>
<text class="ts" x="340" y="345" text-anchor="middle">教員組織として権限があるのは、部局長会議より評議会</text>
</svg>