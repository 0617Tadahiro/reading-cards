<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="20" y="70" width="120" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="80" y="100" text-anchor="middle" dominant-baseline="central">研究成果</text></g>
<g class="c-teal"><rect x="175" y="70" width="140" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="245" y="90" text-anchor="middle" dominant-baseline="central">口頭報告</text>
<text class="ts" x="245" y="112" text-anchor="middle" dominant-baseline="central">審査は緩い・詳細は伏せる</text></g>
<g class="c-teal"><rect x="350" y="70" width="140" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="420" y="90" text-anchor="middle" dominant-baseline="central">論文投稿</text>
<text class="ts" x="420" y="112" text-anchor="middle" dominant-baseline="central">厳しい査読・修正</text></g>
<g class="c-purple"><rect x="525" y="70" width="135" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="592" y="90" text-anchor="middle" dominant-baseline="central">公表</text>
<text class="ts" x="592" y="112" text-anchor="middle" dominant-baseline="central">ここで評価になる</text></g>
<line x1="140" y1="100" x2="171" y2="100" class="arr" marker-end="url(#arrow)"/>
<line x1="315" y1="100" x2="346" y2="100" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="100" x2="521" y2="100" class="arr" marker-end="url(#arrow)"/>
<path d="M245 130 L245 180" fill="none" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts" x="245" y="200" text-anchor="middle">論文にならなければ</text>
<text class="ts" x="245" y="218" text-anchor="middle">「存在しなかった」のと同じ</text>
<text class="ts" x="330" y="40" text-anchor="middle">フィードバックで論文を磨く</text>
<path d="M245 66 L245 48 L420 48 L420 66" fill="none" stroke="var(--b)" stroke-width="0.6" marker-end="url(#arrow)"/>
</svg>