<text class="th" x="40" y="40">2単位＝45時間×2＝90時間の学習</text>
<g class="c-purple"><rect x="40" y="60" width="200" height="56" rx="6" stroke-width="0.5"/>
<text class="th" x="140" y="80" text-anchor="middle" dominant-baseline="central">授業中 30時間</text>
<text class="ts" x="140" y="100" text-anchor="middle" dominant-baseline="central">90分を2時間×15回</text></g>
<g class="c-teal"><rect x="244" y="60" width="396" height="56" rx="6" stroke-width="0.5"/>
<text class="th" x="442" y="80" text-anchor="middle" dominant-baseline="central">授業外 60時間</text>
<text class="ts" x="442" y="100" text-anchor="middle" dominant-baseline="central">予習・復習・課題</text></g>
<line x1="442" y1="116" x2="442" y2="146" stroke="var(--b)" stroke-width="0.5"/>
<text class="th" x="442" y="168" text-anchor="middle">÷15回＝毎週4時間</text>
<text class="ts" x="442" y="192" text-anchor="middle">教員は文献講読・練習問題・レポートなどの課題で埋める</text>
</svg>