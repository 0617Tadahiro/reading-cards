<g class="c-purple"><rect x="30" y="40" width="190" height="150" rx="12" stroke-width="0.5"/>
<text class="th" x="125" y="66" text-anchor="middle" dominant-baseline="central">職階</text>
<text class="ts" x="125" y="96" text-anchor="middle" dominant-baseline="central">助手・助教・講師</text>
<text class="ts" x="125" y="120" text-anchor="middle" dominant-baseline="central">准教授・教授</text>
<text class="ts" x="125" y="160" text-anchor="middle" dominant-baseline="central">審査で一段ずつ上がる</text></g>
<g class="c-teal"><rect x="245" y="40" width="190" height="150" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="66" text-anchor="middle" dominant-baseline="central">雇用の冠</text>
<text class="ts" x="340" y="96" text-anchor="middle" dominant-baseline="central">特任・特命（任期付き）</text>
<text class="ts" x="340" y="120" text-anchor="middle" dominant-baseline="central">非常勤（時給）</text>
<text class="ts" x="340" y="160" text-anchor="middle" dominant-baseline="central">職階の前に付く</text></g>
<g class="c-gray"><rect x="460" y="40" width="190" height="150" rx="12" stroke-width="0.5"/>
<text class="th" x="555" y="66" text-anchor="middle" dominant-baseline="central">称号</text>
<text class="ts" x="555" y="96" text-anchor="middle" dominant-baseline="central">名誉教授</text>
<text class="ts" x="555" y="120" text-anchor="middle" dominant-baseline="central">客員教授・招聘教授</text>
<text class="ts" x="555" y="160" text-anchor="middle" dominant-baseline="central">雇用関係とは別物</text></g>
<text class="th" x="232" y="224" text-anchor="middle">例：特任准教授 ＝ 特任（任期付き）＋ 准教授（職階）</text>
</svg>