<g class="c-coral"><rect x="200" y="200" width="280" height="64" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="222" text-anchor="middle" dominant-baseline="central">査読者＝世界中の研究者</text>
<text class="ts" x="340" y="244" text-anchor="middle" dominant-baseline="central">無報酬の「義務」、極東の教員にも届く</text></g>
