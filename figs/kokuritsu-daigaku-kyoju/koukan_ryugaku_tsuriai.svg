<svg width="680" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img"><style>:root{--purple:#7F77DD;--coral:#D85A30;--teal:#1D9E75;--blue:#378ADD;--amber:#BA7517;--green:#639922;--red:#E24B4A;--gray:#888780}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}text{fill:#233A5C}</style><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style><title>交換留学は「お互いさま」、でも授業料の差が10倍だと釣り合わない</title><desc>上段は、日本の大学と海外の大学が協定を結び、互いの学生を授業料なしで受け入れて釣り合いを取る交換留学の仕組み。下段は、日本の国立大学の授業料が年約54万円、英米の大学が年500万円以上と約10倍の差があるため、海外側は免除すると大きな収入減になり、日本の学生を附属語学学校に入れて追加授業料を取ろうとするゆがみを示す図</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="30" width="200" height="60" rx="10" stroke-width="0.5"/>
<text class="th" x="140" y="52" text-anchor="middle" dominant-baseline="central">日本の大学</text>
<text class="ts" x="140" y="72" text-anchor="middle" dominant-baseline="central">授業料 年約54万円</text></g>
<g class="c-purple"><rect x="440" y="30" width="200" height="60" rx="10" stroke-width="0.5"/>
<text class="th" x="540" y="52" text-anchor="middle" dominant-baseline="central">英米の大学</text>
<text class="ts" x="540" y="72" text-anchor="middle" dominant-baseline="central">授業料 年500万円以上</text></g>
<line x1="240" y1="50" x2="436" y2="50" class="arr" marker-end="url(#arrow)"/>
<line x1="436" y1="72" x2="244" y2="72" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="40" text-anchor="middle">日本の学生（授業料なし）</text>
<text class="ts" x="340" y="92" text-anchor="middle">相手の学生（授業料なし）</text>
<text class="th" x="340" y="130" text-anchor="middle">協定で釣り合いを取る＝交換留学</text>
<line x1="20" y1="155" x2="660" y2="155" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<rect class="c-teal" x="60" y="190" width="40" height="40" rx="4" stroke-width="0.5"/>
<rect class="c-purple" x="120" y="190" width="400" height="40" rx="4" stroke-width="0.5"/>
<text class="ts" x="80" y="245" text-anchor="middle">日本</text>
<text class="ts" x="320" y="210" text-anchor="middle" dominant-baseline="central">英米は約10倍：免除すると大きな収入減</text>
<g class="c-coral"><rect x="160" y="260" width="360" height="44" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="282" text-anchor="middle" dominant-baseline="central">→ 附属の語学学校に入れて追加授業料を取る</text></g>
</svg>