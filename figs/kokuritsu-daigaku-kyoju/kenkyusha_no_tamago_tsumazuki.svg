<svg width="680" height="310" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img"><style>:root{--purple:#7F77DD;--coral:#D85A30;--teal:#1D9E75;--blue:#378ADD;--amber:#BA7517;--green:#639922;--red:#E24B4A;--gray:#888780}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}text{fill:#233A5C}</style><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style><title>院生のつまずきは、頭の良さではなく「研究への切り替え」で起きる</title><desc>大学院生がつまずく三つの型を並べた図。一つ目は模範解答を探す勉強の癖が抜けず新規性が出せない、二つ目はすべてを完璧に調べようとして見切りがつけられない、三つ目は必要な数学や語学から逃げて研究が止まる。それぞれの抜け出し方として、誰もやっていない問いを立てる、目的を狭く絞って切り捨てる、手法に合わせて目的を変える、を示す</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="120" y="28" text-anchor="middle">勉強の癖</text>
<text class="th" x="340" y="28" text-anchor="middle">完璧性の罠</text>
<text class="th" x="560" y="28" text-anchor="middle">苦手からの逃避</text>
<g class="c-coral"><rect x="30" y="45" width="180" height="90" rx="10" stroke-width="0.5"/>
<text class="ts" x="120" y="72" text-anchor="middle" dominant-baseline="central">模範解答を探す</text>
<text class="ts" x="120" y="96" text-anchor="middle" dominant-baseline="central">同じ問題・同じ手法</text>
<text class="ts" x="120" y="118" text-anchor="middle" dominant-baseline="central">＝包丁がえらいだけ</text></g>
<g class="c-coral"><rect x="250" y="45" width="180" height="90" rx="10" stroke-width="0.5"/>
<text class="ts" x="340" y="72" text-anchor="middle" dominant-baseline="central">原因を全部調べたい</text>
<text class="ts" x="340" y="96" text-anchor="middle" dominant-baseline="central">見切りがつけられない</text>
<text class="ts" x="340" y="118" text-anchor="middle" dominant-baseline="central">＝論文が書けない</text></g>
<g class="c-coral"><rect x="470" y="45" width="180" height="90" rx="10" stroke-width="0.5"/>
<text class="ts" x="560" y="72" text-anchor="middle" dominant-baseline="central">数学・語学が嫌い</text>
<text class="ts" x="560" y="96" text-anchor="middle" dominant-baseline="central">必要な手法を避ける</text>
<text class="ts" x="560" y="118" text-anchor="middle" dominant-baseline="central">＝研究が途中で止まる</text></g>
<line x1="120" y1="135" x2="120" y2="181" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="135" x2="340" y2="181" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="135" x2="560" y2="181" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="30" y="185" width="180" height="60" rx="10" stroke-width="0.5"/>
<text class="ts" x="120" y="215" text-anchor="middle" dominant-baseline="central">誰もやっていない問いを</text></g>
<g class="c-teal"><rect x="250" y="185" width="180" height="60" rx="10" stroke-width="0.5"/>
<text class="ts" x="340" y="215" text-anchor="middle" dominant-baseline="central">目的を絞って切り捨てる</text></g>
<g class="c-teal"><rect x="470" y="185" width="180" height="60" rx="10" stroke-width="0.5"/>
<text class="ts" x="560" y="215" text-anchor="middle" dominant-baseline="central">手法に合わせ目的を変える</text></g>
<text class="ts" x="340" y="285" text-anchor="middle">いずれも受験的な「頭の良さ」とは別の能力</text>
</svg>