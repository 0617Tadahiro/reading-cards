<text class="ts" x="160" y="150" text-anchor="middle" dominant-baseline="central">年に数十万円</text></g>
<g class="c-coral"><rect x="40" y="200" width="240" height="50" rx="8" stroke-width="0.5"/>
<text class="ts" x="160" y="225" text-anchor="middle" dominant-baseline="central">研究には年100万円超 → 足りない</text></g>
