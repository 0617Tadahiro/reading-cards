<g class="c-teal"><rect x="380" y="130" width="240" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="500" y="150" text-anchor="middle" dominant-baseline="central">知名度とネットワーク</text></g>
<g class="c-purple"><rect x="380" y="200" width="240" height="50" rx="8" stroke-width="0.5"/>
