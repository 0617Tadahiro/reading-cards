<text class="ts" x="430" y="94" text-anchor="start">同じ大学・同世代・同分野</text>
<text class="ts" x="430" y="114" text-anchor="start">論文・資金・ポストを奪い合う</text>
<line x1="320" y1="190" x2="420" y2="190" stroke="var(--b)" stroke-width="0.5"/>
<text class="th" x="430" y="184" text-anchor="start">中間：序列争い</text>
<text class="ts" x="430" y="206" text-anchor="start">先輩後輩・年功序列</text>
<line x1="370" y1="250" x2="420" y2="270" stroke="var(--b)" stroke-width="0.5"/>
<text class="th" x="430" y="268" text-anchor="start">外側：むしろ仲が良い</text>
<text class="ts" x="430" y="290" text-anchor="start">縄張りが重ならない</text>
