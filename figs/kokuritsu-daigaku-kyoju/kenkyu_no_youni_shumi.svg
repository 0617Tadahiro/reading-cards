<svg width="680" height="280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img"><style>:root{--purple:#7F77DD;--coral:#D85A30;--teal:#1D9E75;--blue:#378ADD;--amber:#BA7517;--green:#639922;--red:#E24B4A;--gray:#888780}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}text{fill:#233A5C}</style><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style><title>楽しかった研究が仕事になり、その「頂点を目指す癖」が趣味に向かう</title><desc>若い頃は研究そのものが楽しみ（インタビューや新しいデータの発見）だったが、大学教員になると研究は仕事になり、関心外の題材・分析の失敗・査読の酷評で楽しめなくなる。そこで、目標を決めて鍛錬し結果を出すという研究者の性質が、マラソン・ロードバイク・マスターズ大会・個展などの趣味に向かう、という流れを示した図</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="20" y="40" width="190" height="90" rx="12" stroke-width="0.5"/>
<text class="th" x="115" y="64" text-anchor="middle" dominant-baseline="central">若い頃</text>
<text class="ts" x="115" y="92" text-anchor="middle" dominant-baseline="central">研究が楽しみ</text>
<text class="ts" x="115" y="112" text-anchor="middle" dominant-baseline="central">インタビュー・新発見</text></g>
<g class="c-gray"><rect x="245" y="40" width="190" height="90" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="64" text-anchor="middle" dominant-baseline="central">教員になると</text>
<text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">研究は仕事</text>
<text class="ts" x="340" y="112" text-anchor="middle" dominant-baseline="central">酷評・出口なし</text></g>
<g class="c-purple"><rect x="470" y="40" width="190" height="90" rx="12" stroke-width="0.5"/>
<text class="th" x="565" y="64" text-anchor="middle" dominant-baseline="central">年をとると</text>
<text class="ts" x="565" y="92" text-anchor="middle" dominant-baseline="central">趣味に打ち込む</text>
<text class="ts" x="565" y="112" text-anchor="middle" dominant-baseline="central">研究のように</text></g>
<line x1="210" y1="85" x2="241" y2="85" class="arr" marker-end="url(#arrow)"/>
<line x1="435" y1="85" x2="466" y2="85" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="120" y="170" width="440" height="80" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="194" text-anchor="middle" dominant-baseline="central">変わらない性質：目標を決め、鍛え、結果を出す</text>
<text class="ts" x="340" y="224" text-anchor="middle" dominant-baseline="central">マラソン・トライアスロン・ロードバイク・マスターズ大会・個展</text></g>
<line x1="565" y1="130" x2="565" y2="150" stroke="var(--b)" stroke-width="0.5"/>
<line x1="565" y1="150" x2="500" y2="166" class="arr" marker-end="url(#arrow)"/>
</svg>