<svg width="680" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img"><style>:root{--purple:#7F77DD;--coral:#D85A30;--teal:#1D9E75;--blue:#378ADD;--amber:#BA7517;--green:#639922;--red:#E24B4A;--gray:#888780}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}text{fill:#233A5C}</style><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style><title>部局長は「教授会が選ぶ」から「教授会が推し、学長が任命する」へ</title><desc>法人化前は教授会の選挙で部局長が決まったが、法人化後は教授会の選挙（被選挙権は教授、選挙権は講師以上、過半数まで決選投票）で推薦者を選び、学長・理事の面接を経て学長が任命する流れになったことを示す対比図</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="150" y="28" text-anchor="middle">かつて</text>
<text class="th" x="480" y="28" text-anchor="middle">今（著者の大学）</text>
<g class="c-gray"><rect x="60" y="50" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="78" text-anchor="middle" dominant-baseline="central">教授会の選挙</text></g>
<g class="c-purple"><rect x="60" y="150" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="178" text-anchor="middle" dominant-baseline="central">部局長に決定</text></g>
<line x1="150" y1="106" x2="150" y2="146" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="40" x2="320" y2="280" stroke="var(--b)" stroke-width="0.5"/>
<g class="c-gray"><rect x="380" y="45" width="200" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="65" text-anchor="middle" dominant-baseline="central">教授会の選挙</text>
<text class="ts" x="480" y="87" text-anchor="middle" dominant-baseline="central">過半数まで決選投票</text></g>
<g class="c-teal"><rect x="380" y="130" width="200" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="155" text-anchor="middle" dominant-baseline="central">推薦</text></g>
<g class="c-coral"><rect x="380" y="200" width="200" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="480" y="220" text-anchor="middle" dominant-baseline="central">学長・理事の面接</text></g>
<g class="c-purple"><rect x="380" y="255" width="200" height="36" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="273" text-anchor="middle" dominant-baseline="central">学長が任命</text></g>
<line x1="480" y1="105" x2="480" y2="126" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="180" x2="480" y2="196" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="240" x2="480" y2="251" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="600" y="70" text-anchor="start">被選挙権：教授</text>
<text class="ts" x="600" y="88" text-anchor="start">選挙権：講師以上</text>
</svg>