<g class="c-gray"><rect x="20" y="20" width="640" height="290" rx="16" stroke-width="0.5"/>
<text class="th" x="40" y="46">大学全体のルール（本部の権限）</text>
<text class="ts" x="490" y="96" text-anchor="middle" dominant-baseline="central">常勤教職員の給与</text>
<text class="ts" x="490" y="128" text-anchor="middle" dominant-baseline="central">人件費・人事の枠</text>
<text class="ts" x="490" y="160" text-anchor="middle" dominant-baseline="central">ハラスメントの調査・処分</text>
<text class="ts" x="490" y="192" text-anchor="middle" dominant-baseline="central">理事・副学長の選任</text>
<text class="ts" x="490" y="224" text-anchor="middle" dominant-baseline="central">大学全体の運営</text></g>
<g class="c-purple"><rect x="50" y="66" width="300" height="220" rx="12" stroke-width="0.5"/>
<text class="th" x="200" y="92" text-anchor="middle" dominant-baseline="central">教授会が決められること</text>
<text class="ts" x="200" y="128" text-anchor="middle" dominant-baseline="central">入試の合否・学生の卒業</text>
<text class="ts" x="200" y="156" text-anchor="middle" dominant-baseline="central">カリキュラム・時間割</text>
<text class="ts" x="200" y="184" text-anchor="middle" dominant-baseline="central">配分予算と外部資金の使い道</text>
<text class="ts" x="200" y="212" text-anchor="middle" dominant-baseline="central">本部が承認した人事</text>
<text class="ts" x="200" y="252" text-anchor="middle" dominant-baseline="central">＝部局の国会</text></g>
