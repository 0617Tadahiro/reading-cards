<text class="ts" x="315" y="270" text-anchor="middle" dominant-baseline="central">1〜3年、昇進なし</text></g>
<g class="c-purple"><rect x="490" y="80" width="170" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="575" y="100" text-anchor="middle" dominant-baseline="central">テニュア</text>
<text class="ts" x="575" y="120" text-anchor="middle" dominant-baseline="central">定年まで雇用</text></g>
<g class="c-gray"><rect x="490" y="230" width="170" height="56" rx="10" stroke-width="0.5"/>
