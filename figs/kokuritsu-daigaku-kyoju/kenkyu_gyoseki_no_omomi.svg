<svg width="680" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img"><style>:root{--purple:#7F77DD;--coral:#D85A30;--teal:#1D9E75;--blue:#378ADD;--amber:#BA7517;--green:#639922;--red:#E24B4A;--gray:#888780}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}text{fill:#233A5C}</style><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style><title>同じ「書いたもの」でも、業績としての重みは段違い</title><desc>研究成果を重みの順に並べたピラミッド図。頂点にWeb of ScienceやScopus収録の査読付き国際誌、次に査読付き国内誌、その下に紀要など査読なしの論文、学術書は分野によって評価が大きく変わることを示し、最下段の新書・コラム・テレビ出演は研究業績ではなく社会貢献として扱われる</desc>
<g class="c-purple"><path d="M340 20 L420 90 L260 90 Z" stroke-width="0.5"/></g>
<text class="ts" x="340" y="72" text-anchor="middle" dominant-baseline="central">国際誌</text>
<text class="ts" x="460" y="50" text-anchor="start">WoS・Scopus収録の査読付き国際誌</text>
<g class="c-teal"><path d="M258 94 L422 94 L480 145 L200 145 Z" stroke-width="0.5"/></g>
<text class="ts" x="340" y="120" text-anchor="middle" dominant-baseline="central">査読付き国内誌</text>
<g class="c-gray"><path d="M198 149 L482 149 L540 200 L140 200 Z" stroke-width="0.5"/></g>
<text class="ts" x="340" y="175" text-anchor="middle" dominant-baseline="central">紀要など査読なし論文</text>
<line x1="20" y1="222" x2="660" y2="222" stroke="var(--b)" stroke-width="0.8" stroke-dasharray="6 4"/>
<text class="ts" x="640" y="214" text-anchor="end">ここから下は研究業績に数えない</text>
<g class="c-coral"><rect x="100" y="236" width="480" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="254" text-anchor="middle" dominant-baseline="central">新書・コラム・テレビ出演</text>
<text class="ts" x="340" y="274" text-anchor="middle" dominant-baseline="central">＝社会貢献として評価</text></g>
<text class="ts" x="40" y="120" text-anchor="start">学術書は</text>
<text class="ts" x="40" y="138" text-anchor="start">分野で上下が</text>
<text class="ts" x="40" y="156" text-anchor="start">入れ替わる</text>
<text class="ts" x="340" y="312" text-anchor="middle">人文学では学術書が頂点級、自然科学では一般向け扱い</text>
</svg>