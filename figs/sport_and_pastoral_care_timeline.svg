<svg width="680" height="220" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 220" role="img"><title>耐える訓育からケアの時代へ</title><desc>17世紀にスポーツが重視され始め、18世紀に学校生活の中核に、19世紀後半にカリキュラムに組み込まれる。1920年代は粗食と厳しい住環境とスポーツで忍耐を鍛える時代。1950年代にパストラル・ケアの時代へ転換</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<text class="th" x="40" y="28">「耐える訓育」から「ケア」の時代へ</text>
<line x1="40" y1="110" x2="640" y2="110" stroke="var(--b)" stroke-width="1.5"/>
<rect x="60" y="104" width="440" height="12" rx="6" fill="#B4B2A9" fill-opacity="0.4"/>
<circle cx="80" cy="110" r="7" fill="#888780"/><text class="th" x="80" y="88" text-anchor="middle">17世紀</text><text class="ts" x="80" y="140" text-anchor="middle">スポーツが</text><text class="ts" x="80" y="157" text-anchor="middle">重視され始める</text>
<circle cx="200" cy="110" r="7" fill="#888780"/><text class="th" x="200" y="88" text-anchor="middle">18世紀</text><text class="ts" x="200" y="140" text-anchor="middle">学校生活の</text><text class="ts" x="200" y="157" text-anchor="middle">中核に</text>
<circle cx="320" cy="110" r="7" fill="#888780"/><text class="th" x="320" y="88" text-anchor="middle">19世紀後半</text><text class="ts" x="320" y="140" text-anchor="middle">カリキュラムに</text><text class="ts" x="320" y="157" text-anchor="middle">組み込み</text>
<circle cx="440" cy="110" r="7" fill="#D85A30"/><text class="th" x="440" y="88" text-anchor="middle">1920年代</text><text class="ts" x="440" y="140" text-anchor="middle">粗食・寒さ・</text><text class="ts" x="440" y="157" text-anchor="middle">スポーツで忍耐</text>
<circle cx="580" cy="110" r="9" fill="#1D9E75"/><text class="th" x="580" y="88" text-anchor="middle">1950年代</text><text class="ts" x="580" y="140" text-anchor="middle">パストラル・</text><text class="ts" x="580" y="157" text-anchor="middle">ケアの時代へ</text>
<text class="ts" x="40" y="200">※間隔は時間の長さに比例していません</text>
</svg>