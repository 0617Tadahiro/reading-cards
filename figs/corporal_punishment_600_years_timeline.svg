<svg width="680" height="220" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 220" role="img"><title>鞭打ちが続いた約600年</title><desc>1382年ウィンチェスター創立から、1853年ハロウの31回鞭打ち事件、1968年映画『if もしも…』、1982年ヨーロッパ人権裁判所判決、1986年公立学校で禁止、1998年私立学校で禁止まで</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<text class="th" x="40" y="30">鞭打ちが続いた約600年</text>
<line x1="40" y1="120" x2="640" y2="120" stroke="var(--b)" stroke-width="1.5"/>
<rect x="60" y="114" width="520" height="12" rx="6" fill="#F0997B" fill-opacity="0.3"/>
<circle cx="70" cy="120" r="7" fill="#888780"/><text class="th" x="70" y="98" text-anchor="middle">1382</text><text class="ts" x="70" y="150" text-anchor="middle">ウィンチェスター</text><text class="ts" x="70" y="167" text-anchor="middle">創立</text>
<circle cx="200" cy="120" r="7" fill="#D85A30"/><text class="th" x="200" y="98" text-anchor="middle">1853</text><text class="ts" x="200" y="150" text-anchor="middle">ハロウで</text><text class="ts" x="200" y="167" text-anchor="middle">31回の鞭打ち</text>
<circle cx="320" cy="120" r="7" fill="#D85A30"/><text class="th" x="320" y="98" text-anchor="middle">1968</text><text class="ts" x="320" y="150" text-anchor="middle">映画『if』</text>
<circle cx="430" cy="120" r="7" fill="#534AB7"/><text class="th" x="430" y="98" text-anchor="middle">1982</text><text class="ts" x="430" y="150" text-anchor="middle">欧州人権</text><text class="ts" x="430" y="167" text-anchor="middle">裁判所の判決</text>
<circle cx="530" cy="120" r="7" fill="#1D9E75"/><text class="th" x="530" y="98" text-anchor="middle">1986</text><text class="ts" x="530" y="150" text-anchor="middle">公立で禁止</text>
<circle cx="620" cy="120" r="7" fill="#1D9E75"/><text class="th" x="620" y="98" text-anchor="middle">1998</text><text class="ts" x="620" y="150" text-anchor="middle">私立で禁止</text>
<text class="ts" x="40" y="205">※年表の間隔は時間の長さに比例していません</text>
</svg>