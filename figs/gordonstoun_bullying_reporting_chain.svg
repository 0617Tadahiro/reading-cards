<line x1="320" y1="95" x2="346" y2="95" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="350" y="70" width="125" height="50" rx="8" stroke-width="0.5"/><text class="th" x="412" y="95" text-anchor="middle" dominant-baseline="central">副校長</text></g>
<line x1="475" y1="95" x2="501" y2="95" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="505" y="70" width="145" height="50" rx="8" stroke-width="0.5"/><text class="th" x="577" y="88" text-anchor="middle" dominant-baseline="central">パストラル担当</text><text class="th" x="577" y="106" text-anchor="middle" dominant-baseline="central">副校長</text></g>
<line x1="577" y1="120" x2="577" y2="156" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="400" y="160" width="250" height="50" rx="8" stroke-width="0.5"/><text class="th" x="525" y="178" text-anchor="middle" dominant-baseline="central">校長らが協議して処分</text><text class="ts" x="525" y="196" text-anchor="middle" dominant-baseline="central">一度でも永久退学がありうる</text></g>
</svg>