<svg width="680" height="220" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 220" role="img"><title>イングランドの同性愛と法</title><desc>1885年に男性同士の行為を広く処罰する法、1895年オスカー・ワイルド投獄、1930年代に映画の舞台、1952年アラン・チューリング有罪、1967年に部分的に合法化、2014年に同性婚</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<text class="th" x="40" y="30">映画の1930年代は「犯罪」の時代のただ中</text>
<line x1="40" y1="110" x2="640" y2="110" stroke="var(--b)" stroke-width="1.5"/>
<rect x="60" y="104" width="390" height="12" rx="6" fill="#F09595" fill-opacity="0.35"/>
<circle cx="70" cy="110" r="7" fill="#A32D2D"/><text class="th" x="70" y="88" text-anchor="middle">1885</text><text class="ts" x="70" y="140" text-anchor="middle">処罰法の</text><text class="ts" x="70" y="157" text-anchor="middle">強化</text>
<circle cx="170" cy="110" r="7" fill="#A32D2D"/><text class="th" x="170" y="88" text-anchor="middle">1895</text><text class="ts" x="170" y="140" text-anchor="middle">ワイルド</text><text class="ts" x="170" y="157" text-anchor="middle">投獄</text>
<circle cx="270" cy="110" r="9" fill="#D85A30"/><text class="th" x="270" y="88" text-anchor="middle">1930年代</text><text class="ts" x="270" y="140" text-anchor="middle">映画の舞台</text>
<circle cx="370" cy="110" r="7" fill="#A32D2D"/><text class="th" x="370" y="88" text-anchor="middle">1952</text><text class="ts" x="370" y="140" text-anchor="middle">チューリング</text><text class="ts" x="370" y="157" text-anchor="middle">有罪</text>
<circle cx="470" cy="110" r="7" fill="#1D9E75"/><text class="th" x="470" y="88" text-anchor="middle">1967</text><text class="ts" x="470" y="140" text-anchor="middle">部分的に</text><text class="ts" x="470" y="157" text-anchor="middle">合法化</text>
<circle cx="600" cy="110" r="7" fill="#1D9E75"/><text class="th" x="600" y="88" text-anchor="middle">2014</text><text class="ts" x="600" y="140" text-anchor="middle">同性婚</text><text class="ts" x="600" y="157" text-anchor="middle">（英・ウェールズ）</text>
<text class="ts" x="40" y="200">※間隔は時間の長さに比例していません</text>
</svg>