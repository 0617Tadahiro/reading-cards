<svg width="680" height="330" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 680 330" role="img"><title>トマス・アーノルドの七つの改革</title><desc>知では古典に哲学と生き方を学ぶ価値を与え、チュートリアルを導入。徳では礼拝堂を中心にクリスチャン・ジェントルマンを育成。体では団体スポーツでリーダーシップを学ぶ。組織ではハウスマスターと生徒の第二の親子関係、監督生とファギング制度の活用、生活指導を監督生に任せて教師を教育に専念させる</desc><style>:root{--p:#233A5C;--s:#5B6575;--t:#8A93A3;--bg2:#F3F3EE;--b:#B9C3CF}text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}.t{font-size:14px;fill:#233A5C}.ts{font-size:12px;fill:#5B6575}.th{font-size:14px;font-weight:600;fill:#233A5C}path.shape{fill:#F3F3EE;stroke:#B9C3CF}.box{fill:#F3F3EE;stroke:#B9C3CF}.arr{stroke:#8A93A3;stroke-width:1.5;fill:none}.leader{stroke:#8A93A3;stroke-width:.5;stroke-dasharray:4 3;fill:none}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>path.shape{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>path.shape{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>path.shape{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon,rect.c-pink,circle.c-pink,ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>path.shape{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>path.shape{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>path.shape{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>path.shape{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>path.shape{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon,rect.c-red,circle.c-red,ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>path.shape{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}path.shape{fill:#F3F3EE;stroke:#B9C3CF}</style>
<g class="c-coral"><rect x="240" y="20" width="200" height="50" rx="10" stroke-width="0.5"/><text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">アーノルドの改革</text><text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">ラグビー校・1828年〜</text></g>
<g class="c-purple"><rect x="20" y="90" width="310" height="90" rx="8" stroke-width="0.5"/><text class="th" x="175" y="112" text-anchor="middle" dominant-baseline="central">知</text><text class="ts" x="175" y="136" text-anchor="middle" dominant-baseline="central">①古典を翻訳でなく哲学と生き方の学びに</text><text class="ts" x="175" y="158" text-anchor="middle" dominant-baseline="central">②1対1のチュートリアル</text></g>
<g class="c-teal"><rect x="350" y="90" width="310" height="90" rx="8" stroke-width="0.5"/><text class="th" x="505" y="112" text-anchor="middle" dominant-baseline="central">徳</text><text class="ts" x="505" y="136" text-anchor="middle" dominant-baseline="central">⑤礼拝堂を教育の中心に</text><text class="ts" x="505" y="158" text-anchor="middle" dominant-baseline="central">クリスチャン・ジェントルマン、他者への愛</text></g>
<g class="c-amber"><rect x="20" y="196" width="310" height="110" rx="8" stroke-width="0.5"/><text class="th" x="175" y="218" text-anchor="middle" dominant-baseline="central">体</text><text class="ts" x="175" y="242" text-anchor="middle" dominant-baseline="central">⑥団体スポーツを重視</text><text class="ts" x="175" y="264" text-anchor="middle" dominant-baseline="central">チームプレーでリーダーシップと</text><text class="ts" x="175" y="284" text-anchor="middle" dominant-baseline="central">ジェントルマンシップを学ぶ</text></g>
<g class="c-gray"><rect x="350" y="196" width="310" height="110" rx="8" stroke-width="0.5"/><text class="th" x="505" y="218" text-anchor="middle" dominant-baseline="central">組織</text><text class="ts" x="505" y="242" text-anchor="middle" dominant-baseline="central">③監督生とファギングで下級生を保護</text><text class="ts" x="505" y="264" text-anchor="middle" dominant-baseline="central">④全員が寮に所属、寮監と第二の親子に</text><text class="ts" x="505" y="284" text-anchor="middle" dominant-baseline="central">⑦生活指導は監督生、教師は教育に専念</text></g>
</svg>