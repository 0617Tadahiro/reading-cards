<g class="c-purple"><rect x="30" y="200" width="180" height="70" rx="8" stroke-width="0.5"/><text class="th" x="120" y="224" text-anchor="middle" dominant-baseline="central">プレU試験</text><text class="ts" x="120" y="246" text-anchor="middle" dominant-baseline="central">2008年〜一部私立校</text></g>
<path d="M120 200 L120 140 L246 100" fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="160">Aレベルの代替</text>
